function bucketFor(prob) {
  if (prob < 0.50) return '<50%';
  if (prob < 0.60) return '50-59%';
  if (prob < 0.70) return '60-69%';
  if (prob < 0.80) return '70-79%';
  return '80%+';
}

async function getBoxscore(gamePk) {
  return fetchJSON(`${API}/game/${gamePk}/boxscore`);
}

async function getBatterStatsThroughDate(id, endDate) {
  try {
    const season = new Date(endDate + 'T12:00:00').getFullYear();
    const startDate = `${season}-03-01`;
    const d = await fetchJSON(
      `${API}/people/${id}/stats?stats=byDateRange&season=${season}&group=hitting` +
      `&startDate=${startDate}&endDate=${endDate}`
    );
    const s = d.stats?.[0]?.splits?.[0]?.stat;
    if (!s) return null;
    const ab = parseInt(s.atBats || '0', 10);
    const pa = parseInt(s.plateAppearances || s.atBats || '0', 10);
    const h  = parseInt(s.hits || '0', 10);
    const so = parseInt(s.strikeOuts || '0', 10);
    return {
      avg: parseFloat(s.avg || '0'),
      ops: parseFloat(s.ops || '0'),
      obp: parseFloat(s.obp || '0'),
      slg: parseFloat(s.slg || '0'),
      ab, pa, hits: h,
      hPerPa: pa > 0 ? h / pa : LEAGUE.hPerPa,
      kPct: pa > 0 ? so / pa : LEAGUE.kPct,
    };
  } catch { return null; }
}

async function getPitcherInfoThroughDate(id, endDate) {
  try {
    const season = new Date(endDate + 'T12:00:00').getFullYear();
    const startDate = `${season}-03-01`;
    const [sd, pd] = await Promise.all([
      fetchJSON(`${API}/people/${id}/stats?stats=byDateRange&season=${season}&group=pitching&startDate=${startDate}&endDate=${endDate}`),
      getPersonInfo(id),
    ]);
    const s  = sd.stats?.[0]?.splits?.[0]?.stat || {};
    const ip = parseFloat(s.inningsPitched || '0');
    return {
      hand: pd.pitchHand || 'R',
      obaa: parseFloat(s.avg || String(LEAGUE.ba)),
      era: parseFloat(s.era || String(LEAGUE.era)),
      whip: parseFloat(s.whip || String(LEAGUE.whip)),
      k9: ip > 0 ? (parseInt(s.strikeOuts || '0', 10) / ip * 9) : LEAGUE.k9,
      ip,
    };
  } catch {
    return getPitcherInfo(id);
  }
}

async function runBacktest() {
  const input = document.getElementById('backtest-date');
  const out = document.getElementById('backtest-output');
  const date = input?.value || addDays(todayStr(), -1);
  const priorDate = addDays(date, -1);
  lastBacktestAuditRows = null;
  out.textContent = 'Running backtest...';

  try {
    const games = (await getSchedule(date)).filter(g =>
      g.status?.statusCode === 'F' &&
      g.lineups?.homePlayers?.length &&
      g.lineups?.awayPlayers?.length
    );
    const pitcherIds = new Set();
    const batterIds = new Set();
    const entries = [];

    for (const g of games) {
      if (g.teams?.home?.probablePitcher?.id) pitcherIds.add(g.teams.home.probablePitcher.id);
      if (g.teams?.away?.probablePitcher?.id) pitcherIds.add(g.teams.away.probablePitcher.id);
      const sides = [
        { side: 'away', players: g.lineups.awayPlayers, team: g.teams?.away?.team?.name ?? 'Away', pitcher: g.teams?.home?.probablePitcher },
        { side: 'home', players: g.lineups.homePlayers, team: g.teams?.home?.team?.name ?? 'Home', pitcher: g.teams?.away?.probablePitcher },
      ];
      for (const side of sides) {
        side.players.forEach((p, idx) => {
          batterIds.add(p.id);
          entries.push({
            gamePk: g.gamePk,
            side: side.side,
            id: p.id,
            name: p.fullName,
            team: side.team,
            lineupPos: idx + 1,
            pitcher: side.pitcher,
            pitcherName: side.pitcher?.fullName ?? '',
            venue: g.venue?.name ?? 'Unknown',
            parkFactor: PARK[g.teams?.home?.team?.id]?.factor ?? 1.00,
          });
        });
      }
    }

    const pitchers = {};
    await Promise.all([...pitcherIds].map(async id => {
      pitchers[id] = await getPitcherInfoThroughDate(id, priorDate);
    }));

    const batters = {};
    const hands = {};
    await Promise.all([...batterIds].map(async id => {
      const [stats, hand] = await Promise.all([getBatterStatsThroughDate(id, priorDate), getBatterHand(id)]);
      batters[id] = stats;
      hands[id] = hand;
    }));

    const preScores = [];
    for (const e of entries) {
      const batter = batters[e.id];
      const pitcher = pitchers[e.pitcher?.id];
      if (!batter || batter.pa < MODEL.minBatterPa || !pitcher) continue;
      preScores.push({
        gamePk: e.gamePk,
        parkFactor: e.parkFactor,
        ...score(batter, pitcher, e.parkFactor, hands[e.id] || 'R', e.lineupPos, 1.0, e.side === 'away'),
      });
    }
    const gameEnvFactors = hitGameEnvironmentFactors(preScores);

    const boxscores = new Map();
    await Promise.all(games.map(async g => {
      boxscores.set(g.gamePk, await getBoxscore(g.gamePk));
    }));

    const buckets = ['<50%', '50-59%', '60-69%', '70-79%', '80%+']
      .map(label => ({ label, count: 0, hits: 0, brier: 0, hitRate: 0 }));
    const bucketMap = new Map(buckets.map(b => [b.label, b]));
    let picks = 0, hits = 0, brier = 0;
    const auditRows = [];

    for (const e of entries) {
      const batter = batters[e.id];
      const pitcher = pitchers[e.pitcher?.id];
      if (!batter || batter.pa < MODEL.minBatterPa || !pitcher) continue;
      const gameEnvFactor = gameEnvFactors.get(e.gamePk) ?? 1.0;
      const s = score(batter, pitcher, e.parkFactor, hands[e.id] || 'R', e.lineupPos, gameEnvFactor, e.side === 'away');
      const boxPlayer = Object.values(boxscores.get(e.gamePk)?.teams?.[e.side]?.players || {})
        .find(p => p.person?.id === e.id);
      if (!boxPlayer?.stats?.batting) continue;
      const batting = boxPlayer.stats.batting;
      const actual = (batting.hits || 0) > 0 ? 1 : 0;
      const err = Math.pow(s.prob - actual, 2);
      picks += 1;
      hits += actual;
      brier += err;
      auditRows.push({
        date,
        sortProb: s.prob,
        result: actual ? 'Hit' : 'Miss',
        hits: batting.hits ?? '',
        atBats: batting.atBats ?? '',
        pick: {
          rank: 0,
          batterName: e.name,
          batterTeam: e.team,
          prob: s.prob,
          pHit: s.pHit,
          pitcherWeakness: s.pitcherWeakness,
          platoon: s.platoon,
          awayAdj: s.awayAdj,
          ttoAdj: s.ttoAdj,
          gameEnvFactor: s.gameEnvFactor,
          parkFactor: s.parkFactor,
          parkAdj: s.parkAdj,
          recentAdj: s.recentAdj,
          contactAdj: s.contactAdj,
          opsAdj: s.opsAdj,
          lineupPos: e.lineupPos,
          pitcherName: e.pitcherName,
          pitcherHand: s.pitcherHand,
          venue: e.venue,
        },
      });
      const bucket = bucketMap.get(bucketFor(s.prob));
      bucket.count += 1;
      bucket.hits += actual;
      bucket.brier += err;
    }

    auditRows.sort((a, b) => b.sortProb - a.sortProb);
    auditRows.forEach((row, idx) => { row.pick.rank = idx + 1; });
    lastBacktestAuditRows = auditRows;

    for (const b of buckets) {
      b.hitRate = b.count ? b.hits / b.count : 0;
      b.brier = b.count ? b.brier / b.count : 0;
    }

    out.innerHTML = renderBacktestResult({
      date,
      games: games.length,
      picks,
      hitRate: picks ? hits / picks : 0,
      brier: picks ? brier / picks : 0,
      buckets,
    });
  } catch (e) {
    lastBacktestAuditRows = null;
    out.innerHTML = `<span class="bad">Backtest failed: ${e.message}</span>`;
  }
}

window.runBacktest = runBacktest;

async function main() {
  const date     = todayStr();
  const startDate = recentStartDate(MODEL.recentDays);

  document.getElementById('date-label').textContent = formatDate(date);
  setUpdatedAt();

  let games;
  try {
    games = await getSchedule(date);
  } catch (e) {
    show(`<div class="error-box">Failed to load schedule: ${e.message}</div>`);
    return;
  }

  if (!games.length) {
    show(
      renderPickTracker() +
      `<div class="info-box"><strong>No Games Today</strong>No MLB games scheduled.</div>` +
      renderBacktestPanel()
    );
    savePageCache();
    return;
  }

  const gamesWithLineups = games.filter(g =>
    isPlayableGame(g) &&
    g.lineups?.homePlayers?.length &&
    g.lineups?.awayPlayers?.length
  );

  if (!gamesWithLineups.length) {
    const playableCount = games.filter(isPlayableGame).length;
    const probCount = games.filter(g =>
      g.teams?.home?.probablePitcher || g.teams?.away?.probablePitcher
    ).length;
    show(
      renderPickTracker() +
      `
      <div class="info-box">
        <strong>Lineups Not Yet Posted</strong>
        ${playableCount} game${playableCount !== 1 ? 's' : ''} still upcoming or live,
        ${probCount} with probable pitchers set.<br><br>
        Lineups typically post 3–4 hours before first pitch.
        <button class="refresh-btn" onclick="refreshPage()">↻ Refresh</button>
      </div>` +
      renderBacktestPanel()
    );
    savePageCache();
    return;
  }

  show(`<div class="loading"><div class="spinner"></div>Analyzing matchups…<div class="stage" id="stage-msg">Fetching pitcher stats…</div></div>`);

  // ── Stage 1: pitcher info (season stats + hand) ────────────────────────────
  const pitcherIds = new Set();
  for (const g of gamesWithLineups) {
    if (g.teams?.home?.probablePitcher?.id) pitcherIds.add(g.teams.home.probablePitcher.id);
    if (g.teams?.away?.probablePitcher?.id) pitcherIds.add(g.teams.away.probablePitcher.id);
  }

  const pitcherInfo = {};
  await Promise.all([...pitcherIds].map(async id => {
    pitcherInfo[id] = await getPitcherInfo(id);
  }));

  // ── Stage 2: batter season stats ──────────────────────────────────────────
  setStage('Fetching batter stats…');

  const batterIds = new Set();
  // Map batter id → lineup position (1-indexed) and hand
  const lineupEntries = [];

  for (const g of gamesWithLineups) {
    const sides = [
      { side: 'away', players: g.lineups.awayPlayers, team: g.teams?.away?.team?.name ?? 'Away', pitcher: g.teams?.home?.probablePitcher },
      { side: 'home', players: g.lineups.homePlayers, team: g.teams?.home?.team?.name ?? 'Home', pitcher: g.teams?.away?.probablePitcher },
    ];
    for (const { side, players, team, pitcher } of sides) {
      players.forEach((p, idx) => {
        batterIds.add(p.id);
        lineupEntries.push({
          key: `${g.gamePk}-${p.id}-${idx}`,
          gamePk: g.gamePk,
          side,
          id: p.id,
          name: p.fullName,
          team,
          lineupPos: idx + 1,
          pitcher,
          homeTeamId: g.teams?.home?.team?.id,
          parkFactor: PARK[g.teams?.home?.team?.id]?.factor ?? 1.00,
          venue: g.venue?.name ?? 'Unknown',
          gameTime: formatTime(g.gameDate),
          statusNote: gameStatusNote(g),
        });
      });
    }
  }

  const batterSeasonStats = {};
  const batterHands = {};
  const ids = [...batterIds];
  const BATCH = 12;
  for (let i = 0; i < ids.length; i += BATCH) {
    setStage(`Fetching batter stats… ${Math.min(i + BATCH, ids.length)}/${ids.length}`);
    await Promise.all(ids.slice(i, i + BATCH).map(async id => {
      const [stats, hand] = await Promise.all([getBatterStats(id), getBatterHand(id)]);
      batterSeasonStats[id] = stats;
      batterHands[id] = hand;
    }));
  }

  // ── Stage 3: initial scoring with season stats only ────────────────────────
  setStage('Scoring…');

  const candidates = [];

  for (const meta of lineupEntries) {
    const bs = batterSeasonStats[meta.id];
    if (!bs || bs.pa < MODEL.minBatterPa || !meta.pitcher) continue;

    const pitcher = pitcherInfo[meta.pitcher.id];
    if (!pitcher) continue;

    const s = score(
      bs, pitcher, meta.parkFactor, batterHands[meta.id] || 'R', meta.lineupPos, 1.0, meta.side === 'away'
    );
    const classic = classicScore(
      bs, pitcher, meta.parkFactor, batterHands[meta.id] || 'R', meta.lineupPos
    );

    candidates.push({
      key:         meta.key,
      gamePk:      meta.gamePk,
      side:        meta.side,
      batterId:    meta.id,
      batterName:  meta.name,
      batterTeam:  meta.team,
      pitcherId:   meta.pitcher.id,
      pitcherName: meta.pitcher.fullName,
      pitcherHand: pitcher.hand,
      homeTeamId:  meta.homeTeamId,
      parkFactor:  meta.parkFactor,
      venue:       meta.venue,
      gameTime:    meta.gameTime,
      statusNote:  meta.statusNote,
      lineupPos:   meta.lineupPos,
      batter:      { ...bs },
      pitcher,
      ...s,
      classicProb: classic.rankProb,
      classicRankProb: classic.rankProb,
      classicDisplayProb: classic.displayProb,
      classicPHit: classic.pHit,
    });
  }

  const gameEnvFactors = hitGameEnvironmentFactors(candidates);
  for (const pick of candidates) {
    const gameEnvFactor = gameEnvFactors.get(pick.gamePk) ?? 1.0;
    Object.assign(pick, score(
      pick.batter, pick.pitcher, pick.parkFactor, pick.batterHand, pick.lineupPos, gameEnvFactor, pick.side === 'away'
    ));
    const classic = classicScore(pick.batter, pick.pitcher, pick.parkFactor, pick.batterHand, pick.lineupPos);
    pick.classicProb = classic.rankProb;
    pick.classicRankProb = classic.rankProb;
    pick.classicDisplayProb = classic.displayProb;
    pick.classicPHit = classic.pHit;
  }
  rankPicks(candidates, 'rankProb', 'currentRank');
  rankPicks(candidates, 'classicRankProb', 'classicRank');
  const top30Keys = new Set([
    ...[...candidates].sort((a, b) => b.rankProb - a.rankProb).slice(0, 30).map(p => p.key),
    ...[...candidates].sort((a, b) => b.classicRankProb - a.classicRankProb).slice(0, 30).map(p => p.key),
  ]);
  const top30 = candidates.filter(p => top30Keys.has(p.key));

  // ── Stage 4: recent form for top 30 batters ────────────────────────────────
  setStage('Fetching recent form (top 30)…');

  await Promise.all(top30.map(async pick => {
    const recent = await getBatterRecent(pick.batterId, startDate, date);
    if (recent) {
      pick.batter.recentAvg = recent.avg;
      pick.batter.recentAb = recent.ab;
      pick.batter.recentPa = recent.pa;
      pick.batter.recentHPerPa = recent.hPerPa;
    }
  }));

  // ── Stage 5: pitcher recent form (unique pitchers in top 30) ───────────────
  setStage('Fetching pitcher recent form…');

  const pitcherRecent = new Map();
  await Promise.all(
    [...new Set(top30.map(p => p.pitcherId).filter(Boolean))].map(async pid => {
      const d = await getPitcherRecentERA(pid);
      pitcherRecent.set(pid, d);
    })
  );

  // Inject recent ERA and re-score top 30
  for (const pick of top30) {
    const pid = pick.pitcherId;
    if (pid && pitcherRecent.has(pid)) {
      const recent = pitcherRecent.get(pid);
      pick.pitcher.recentERA = recent?.era ?? null;
      pick.pitcher.recentIp = recent?.ip ?? 0;
    }
    const gameEnvFactor = gameEnvFactors.get(pick.gamePk) ?? 1.0;
    Object.assign(pick, score(
      pick.batter, pick.pitcher, pick.parkFactor, pick.batterHand, pick.lineupPos, gameEnvFactor, pick.side === 'away'
    ));
    const classic = classicScore(pick.batter, pick.pitcher, pick.parkFactor, pick.batterHand, pick.lineupPos);
    pick.classicProb = classic.rankProb;
    pick.classicRankProb = classic.rankProb;
    pick.classicDisplayProb = classic.displayProb;
    pick.classicPHit = classic.pHit;
  }

  rankPicks(candidates, 'rankProb', 'currentRank');
  rankPicks(candidates, 'classicRankProb', 'classicRank');
  scoreHitRecencyShadows(candidates, gameEnvFactors);
  const lists = hitModelPickLists(top30);
  const topPicks = lists.primary;
  const shadowPicks = hitShadowTrackingPicks(candidates, lists);

  currentPickDate = date;
  currentTopPicks = topPicks;
  currentHitShadowPicks = shadowPicks;

  if (!topPicks.length) {
    const emptyState = shadowPicks.length
      ? `<div class="info-box"><strong>No Primary Picks Today</strong>No candidate was selected by both models while also ranking in the current model's top 10. This can be a legitimate thin slate, not a data failure. The ${shadowPicks.length} excluded candidates remain available as shadow rows.</div>`
      : `<div class="info-box"><strong>No Actionable Picks Today</strong>No candidates had enough usable lineup and player data. Try again after lineups and probable pitchers are confirmed.</div>`;
    show(
      renderHitWatchlist(shadowPicks) +
      renderPickTracker() +
      emptyState +
      renderBacktestPanel()
    );
    savePageCache();
    return;
  }

  show(
    renderSummary(topPicks) +
    `<div class="note">Primary recommendations require both models and a current-model rank of 10 or better. ${shadowPicks.length} excluded candidates are still saved as shadow rows for evaluation.</div>` +
    renderHitWatchlist(shadowPicks) +
    renderPickTracker() +
    topPicks.map((p, i) => renderCard(p, i)).join('') +
    `<button class="refresh-btn" onclick="refreshPage()">↻ Refresh</button>` +
    renderBacktestPanel()
  );
  savePageCache();
}

// Last 5 game-log entries, returned with innings for sample-size shrinkage.
async function getPitcherRecentERA(id) {
  try {
    const d = await fetchJSON(
      `${API}/people/${id}/stats?stats=gameLog&season=${SEASON}&group=pitching`
    );
    const entries = (d.stats?.[0]?.splits || []).slice(-5);
    if (!entries.length) return null;
    let er = 0, ip = 0;
    for (const e of entries) {
      er += parseFloat(e.stat?.earnedRuns     || '0');
      ip += parseFloat(e.stat?.inningsPitched  || '0');
    }
    return ip > 0 ? { era: er / ip * 9, ip } : null;
  } catch { return null; }
}

function show(html) {
  document.getElementById('app').innerHTML = html;
}

function savePageCache() {
  try {
    sessionStorage.setItem(PAGE_CACHE_KEY, JSON.stringify({
      savedAt: Date.now(),
      appHtml: document.getElementById('app')?.innerHTML || '',
      dateLabel: document.getElementById('date-label')?.textContent || '',
      updatedAt: document.getElementById('updated-at')?.textContent || '',
      currentPickDate,
      currentTopPicks,
      currentHitShadowPicks,
      savedStateStamp: savedStateStamp(currentPickDate),
    }));
  } catch {}
}

function restorePageCache() {
  try {
    const cached = JSON.parse(sessionStorage.getItem(PAGE_CACHE_KEY) || 'null');
    if (!cached || Date.now() - cached.savedAt > PAGE_CACHE_TTL) return false;
    const currentStamp = savedStateStamp(cached.currentPickDate);
    if (cached.savedStateStamp && currentStamp && cached.savedStateStamp !== currentStamp) return false;
    document.getElementById('app').innerHTML = cached.appHtml;
    document.getElementById('date-label').textContent = cached.dateLabel || 'Cached picks';
    document.getElementById('updated-at').textContent = cached.updatedAt || '';
    currentPickDate = cached.currentPickDate || null;
    currentTopPicks = cached.currentTopPicks || [];
    currentHitShadowPicks = cached.currentHitShadowPicks || [];
    return true;
  } catch {
    return false;
  }
}

function captureTimeLabel(value) {
  if (!value) return '';
  const captured = new Date(value);
  if (Number.isNaN(captured.getTime())) return '';
  return captured.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

function renderSavedPickSnapshot(saved) {
  const normalized = normalizeSavedPickPayload(saved);
  const hasPrimary = normalized.picks.length > 0;
  let previousRun = null;
  const rows = normalized.picks.map(pick => {
    const run = pickCaptureRun(pick);
    const time = captureTimeLabel(pick.capturedAt);
    const heading = run !== previousRun
      ? `<div class="summary-tier">Save round ${run}${time ? ` - ${time}` : ''}</div>`
      : '';
    previousRun = run;
    return `
    ${heading}
    <div class="summary-row">
      <div class="summary-rank">#${pick.rank}</div>
      <div class="summary-name">${pick.batterName}</div>
      <div class="summary-pct">${pctText(pick.displayProb ?? pick.prob)}</div>
    </div>`;
  }).join('');
  const shadowSummary = normalized.shadowPicks.length
    ? `<div class="summary-tier">${normalized.shadowPicks.length} shadow candidate${normalized.shadowPicks.length === 1 ? '' : 's'} retained for evaluation.</div>`
    : '';

  return `
<div class="summary-list">
  <div class="summary-title">${hasPrimary ? 'Locked Saved Picks' : 'Locked Shadow-Only Slate'}</div>
  ${hasPrimary ? '' : '<div class="summary-tier">No batter met the primary selection rule on this slate.</div>'}
  ${rows}
  ${shadowSummary}
</div>
${hasPrimary ? '' : renderHitWatchlist(normalized.shadowPicks)}
${renderPickTracker()}
<div class="info-box">
  <strong>Showing the saved slate for ${formatDate(normalized.date)}</strong>
  ${hasPrimary
    ? 'Primary picks are shown above; shadow candidates remain available in analysis exports.'
    : 'There were no primary recommendations, but the shadow candidates remain available for result checks and analysis exports.'}
  Use the refresh button only when you want to run a new model list.
</div>
${renderBacktestPanel()}`;
}

function restoreSavedPickView() {
  const saved = getSavedPicksForDate(todayStr()) || getSavedPicksForResults();
  if (!hasHitTrackingRows(saved)) return false;
  currentPickDate = saved.date;
  currentTopPicks = saved.picks;
  currentHitShadowPicks = saved.shadowPicks || [];
  document.getElementById('date-label').textContent = `${formatDate(saved.date)} saved`;
  document.getElementById('updated-at').textContent = `Saved ${new Date(saved.savedAt || Date.now()).toLocaleString()}`;
  show(renderSavedPickSnapshot(saved));
  savePageCache();
  return true;
}

function shouldForceRefresh() {
  try {
    const force = sessionStorage.getItem(FORCE_REFRESH_KEY) === '1';
    sessionStorage.removeItem(FORCE_REFRESH_KEY);
    return force;
  } catch {
    return false;
  }
}

function refreshPage() {
  try {
    sessionStorage.removeItem(PAGE_CACHE_KEY);
    sessionStorage.setItem(FORCE_REFRESH_KEY, '1');
  } catch {}
  location.reload();
}

window.refreshPage = refreshPage;

if (!shouldForceRefresh() && (restorePageCache() || restoreSavedPickView())) {
  // Restored the locked tracking view.
} else {
  main().catch(e => show(
    `<div class="error-box">Error: ${e.message}` +
    `<button class="refresh-btn" onclick="refreshPage()">↻ Retry</button></div>`
  ));
}
</script>
