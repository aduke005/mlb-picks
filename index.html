<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MLB Hit Picks</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --blue: #58a6ff;
  --inset: #0d1117;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
  padding: 16px;
  padding-top: max(20px, env(safe-area-inset-top));
  padding-bottom: max(20px, env(safe-area-inset-bottom));
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
}

header { text-align: center; padding: 12px 0 20px; }

h1 {
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: -0.02em;
}

.subtitle { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-top: 12px;
}

.tab {
  display: block;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  text-decoration: none;
  padding: 9px 10px;
  border-radius: 8px;
  font-size: 0.86rem;
  font-weight: 650;
}

.tab.active {
  color: var(--text);
  border-color: var(--blue);
  background: var(--inset);
}

.top-actions {
  display: flex;
  justify-content: center;
  margin-top: 8px;
}

.top-refresh {
  width: 38px;
  height: 32px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--blue);
  border-radius: 8px;
  font-size: 1rem;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.1s, color 0.1s, border-color 0.1s;
  -webkit-tap-highlight-color: transparent;
}

.top-refresh:active {
  background: var(--blue);
  color: var(--bg);
  border-color: var(--blue);
}

.updated-at {
  font-size: 0.72rem;
  color: var(--muted);
  margin-top: 5px;
  min-height: 1em;
}

/* ---- Cards ---- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin: 12px 0;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}
.card.rank-0::before { background: linear-gradient(90deg, #ffd700, #ffb300); }
.card.rank-1::before { background: linear-gradient(90deg, #c0c0c0, #9e9e9e); }
.card.rank-2::before { background: linear-gradient(90deg, #cd7f32, #a0522d); }
.card.rank-3::before,
.card.rank-4::before,
.card.rank-5::before,
.card.rank-6::before,
.card.rank-7::before,
.card.rank-8::before,
.card.rank-9::before { background: var(--border); }

.rank-label {
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin-bottom: 6px;
}
.card.rank-0 .rank-label { color: #ffd700; }
.card.rank-1 .rank-label { color: #c0c0c0; }
.card.rank-2 .rank-label { color: #cd7f32; }

.batter-name {
  font-size: 1.35rem;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.01em;
}

.batter-team { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }

.prob-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 10px 0 6px;
}

.prob-pct {
  font-size: 2.6rem;
  font-weight: 800;
  color: var(--green);
  letter-spacing: -0.03em;
  line-height: 1;
}

.prob-label { font-size: 0.8rem; color: var(--muted); line-height: 1.3; }

.matchup-line { font-size: 0.85rem; color: var(--text); margin-bottom: 2px; }
.game-time    { font-size: 0.75rem; color: var(--muted); margin-bottom: 10px; }
.card-summary {
  background: var(--inset);
  border-left: 3px solid var(--blue);
  border-radius: 8px;
  padding: 9px 10px;
  margin: 8px 0 10px;
  color: var(--text);
  font-size: 0.8rem;
  line-height: 1.4;
}

/* ---- Stat rows ---- */
.stat-group-label {
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--muted);
  margin-bottom: 4px;
  opacity: 0.7;
}

.stats-row {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
}

.stat {
  flex: 1;
  background: var(--inset);
  border-radius: 8px;
  padding: 7px 4px;
  text-align: center;
}

.stat-value {
  font-size: 1.0rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.stat-label {
  font-size: 0.6rem;
  color: var(--muted);
  margin-top: 2px;
  line-height: 1.2;
}

/* ---- Factor rows ---- */
.factors {
  border-top: 1px solid var(--border);
  padding-top: 10px;
  margin-top: 4px;
}

.factor {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 0;
  font-size: 0.78rem;
}

.factor-name { color: var(--muted); }
.factor-val  { font-weight: 600; }
.good    { color: var(--green); }
.bad     { color: var(--red); }
.neutral { color: var(--yellow); }

/* ---- States ---- */
.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}

.stage {
  font-size: 0.8rem;
  margin-top: 8px;
  min-height: 1.2em;
}

.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}

@keyframes spin { to { transform: rotate(360deg); } }

.info-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  color: var(--muted);
  font-size: 0.9rem;
  line-height: 1.6;
}

.info-box strong { color: var(--text); display: block; margin-bottom: 8px; }

.error-box {
  background: #1f0a0a;
  border: 1px solid var(--red);
  border-radius: 12px;
  padding: 16px;
  color: var(--red);
  font-size: 0.85rem;
}

.status-alert {
  background: #251a06;
  border: 1px solid var(--yellow);
  color: var(--yellow);
  border-radius: 8px;
  padding: 8px 10px;
  margin: 8px 0;
  font-size: 0.76rem;
}

.refresh-btn {
  display: block;
  margin: 16px auto 0;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--blue);
  padding: 10px 24px;
  border-radius: 8px;
  font-size: 0.9rem;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.1s, color 0.1s, border-color 0.1s;
  -webkit-tap-highlight-color: transparent;
}

.refresh-btn:active {
  background: var(--blue);
  color: var(--bg);
  border-color: var(--blue);
}

.inline-note {
  font-size: 0.72rem;
  color: var(--muted);
  margin-top: -2px;
}

.summary-list {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin: 0 0 12px;
  overflow: hidden;
}

.summary-title {
  padding: 10px 12px;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  border-bottom: 1px solid var(--border);
}

.summary-row {
  display: grid;
  grid-template-columns: 42px 1fr 74px 58px;
  gap: 8px;
  align-items: center;
  min-height: 42px;
  padding: 8px 12px;
  border-top: 1px solid var(--border);
}

.summary-title + .summary-row { border-top: 0; }

.summary-tier {
  padding: 8px 12px 4px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 0.62rem;
  font-weight: 750;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.summary-title + .summary-tier { border-top: 0; }

.summary-rank {
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 700;
}

.summary-name {
  color: var(--text);
  font-size: 0.92rem;
  font-weight: 650;
  line-height: 1.15;
  overflow-wrap: anywhere;
}

.summary-time {
  color: var(--muted);
  font-size: 0.76rem;
  font-weight: 650;
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.summary-pct {
  color: var(--green);
  font-size: 1.0rem;
  font-weight: 800;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.model-compare {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 4px;
}

.model-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 2px 7px;
  color: var(--muted);
  font-size: 0.64rem;
  font-weight: 750;
  line-height: 1.4;
}

.model-chip.current { color: var(--green); }
.model-chip.classic { color: var(--blue); }

.bet-input-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: center;
  margin: 10px 0;
  padding: 9px;
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--muted);
  font-size: 0.72rem;
}

.bet-input-row input[type="number"] {
  width: 92px;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px;
}

.tracker {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  margin: 0 0 12px;
}

.tracker-title {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
}

.tracker-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.tracker-actions button:last-child:nth-child(odd) {
  grid-column: 1 / -1;
}

.tracker button {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--blue);
  padding: 9px 10px;
  border-radius: 8px;
  font-size: 0.82rem;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.1s, color 0.1s, border-color 0.1s;
  -webkit-tap-highlight-color: transparent;
}

.tracker button:active {
  background: var(--blue);
  color: var(--bg);
  border-color: var(--blue);
}

.tracker-output {
  margin-top: 9px;
  font-size: 0.76rem;
  color: var(--muted);
  line-height: 1.45;
}

.pick-result-row {
  display: grid;
  grid-template-columns: 58px 1fr 52px;
  gap: 8px;
  padding: 5px 0;
  border-top: 1px solid var(--border);
}

.pick-result-row:first-child { border-top: 0; }

.backtest {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin: 14px 0;
}

.backtest-title {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 10px;
}

.backtest-controls {
  display: flex;
  gap: 8px;
}

.backtest input {
  flex: 1;
  min-width: 0;
  background: var(--inset);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font: inherit;
  padding: 9px 10px;
}

.backtest button {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--blue);
  padding: 9px 12px;
  border-radius: 8px;
  font-size: 0.85rem;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.1s, color 0.1s, border-color 0.1s;
  -webkit-tap-highlight-color: transparent;
}

.backtest button:active {
  background: var(--blue);
  color: var(--bg);
  border-color: var(--blue);
}

.backtest-output {
  margin-top: 10px;
  font-size: 0.76rem;
  color: var(--muted);
  line-height: 1.45;
}

.bucket-row {
  display: grid;
  grid-template-columns: 64px 1fr 64px;
  gap: 8px;
  padding: 4px 0;
  border-top: 1px solid var(--border);
}

.bucket-row:first-child { border-top: 0; }

footer {
  text-align: center;
  padding: 24px 0 8px;
  font-size: 0.7rem;
  color: var(--border);
  line-height: 1.6;
}
</style>
</head>
<body>
<header>
  <h1>⚾ MLB Hit Picks</h1>
  <div class="subtitle" id="date-label">Loading…</div>
  <nav class="tabs" aria-label="Pick type">
    <a class="tab active" href="index.html">Hits</a>
    <a class="tab" href="hr.html">Home Runs</a>
  </nav>
  <div class="top-actions">
    <button class="top-refresh" onclick="refreshPage()" title="Refresh picks" aria-label="Refresh picks">↻</button>
  </div>
  <div class="updated-at" id="updated-at"></div>
</header>

<div id="app">
  <div class="loading">
    <div class="spinner"></div>
    Fetching today's matchups…
  </div>
</div>

<footer>
  Data: MLB Stats API · hitter form · pitcher difficulty · handedness · ballpark · batting order<br>
  Refresh after lineups post (~3–4 hrs before first pitch)
</footer>

<script>
'use strict';

const API    = 'https://statsapi.mlb.com/api/v1';
const SEASON = new Date().getFullYear();
const PICK_STORE_KEY = 'mlb-hit-picks-saved-v1';
const PICK_HISTORY_KEY = 'mlb-hit-picks-history-v1';
const PAGE_CACHE_KEY = 'mlb-hit-picks-page-cache-v2';
const FORCE_REFRESH_KEY = 'mlb-hit-picks-force-refresh-v1';
const PAGE_CACHE_TTL = 15 * 60 * 1000;

let currentPickDate = null;
let currentTopPicks = [];
let currentHitShadowPicks = [];
let lastCheckedPickRows = null;
let lastCheckedPickDate = null;
let lastBacktestAuditRows = null;

// League-average baselines for normalization
const LEAGUE = {
  ba:   0.248,
  hPerPa: 0.223,
  ops:  0.720,
  era:  4.30,
  whip: 1.25,
  k9:   9.0,
  kPct: 0.228,  // batter strikeout %
};

const MODEL = {
  batterPaPrior: 260,
  pitcherIpPrior: 70,
  recentPaPrior: 45,
  minBatterPa: 45,
  maxPerPaHit: 0.48,
  calibrationDamp: 0.80,
  recentDays: 21,
  topPickCount: 10,
};

// Ranking and displayed probability are intentionally separate. Keep the
// production ranking frozen while rolling calibration is evaluated offline.
const HIT_DISPLAY_LOGIT_OFFSET = 0.0;

// Park hit factors by home-team ID (FanGraphs 3-yr regressed hits, 2024)
const PARK = {
  115: { factor: 1.20, name: 'Coors Field'             },
  113: { factor: 1.09, name: 'Great American Ball Park' },
  140: { factor: 1.07, name: 'Globe Life Field'          },
  110: { factor: 1.06, name: 'Oriole Park'              },
  111: { factor: 1.05, name: 'Fenway Park'              },
  143: { factor: 1.05, name: 'Citizens Bank Park'       },
  147: { factor: 1.04, name: 'Yankee Stadium'           },
  158: { factor: 1.03, name: 'American Family Field'    },
  118: { factor: 1.02, name: 'Kauffman Stadium'         },
  112: { factor: 1.02, name: 'Wrigley Field'            },
  144: { factor: 1.01, name: 'Truist Park'              },
  117: { factor: 1.00, name: 'Minute Maid Park'         },
  116: { factor: 1.00, name: 'Comerica Park'            },
  108: { factor: 1.00, name: 'Angel Stadium'            },
  142: { factor: 0.99, name: 'Target Field'             },
  114: { factor: 0.99, name: 'Progressive Field'        },
  138: { factor: 0.98, name: 'Busch Stadium'            },
  121: { factor: 0.98, name: 'Citi Field'               },
  119: { factor: 0.97, name: 'Dodger Stadium'           },
  109: { factor: 0.97, name: 'Chase Field'              },
  141: { factor: 0.97, name: 'Rogers Centre'            },
  139: { factor: 0.96, name: 'Tropicana Field'          },
  120: { factor: 0.96, name: 'Nationals Park'           },
  146: { factor: 0.96, name: 'loanDepot park'           },
  145: { factor: 0.96, name: 'Guaranteed Rate Field'    },
  136: { factor: 0.95, name: 'T-Mobile Park'            },
  134: { factor: 0.95, name: 'PNC Park'                 },
  133: { factor: 0.95, name: 'Sutter Health Park'       },
  137: { factor: 0.93, name: 'Oracle Park'              },
  135: { factor: 0.92, name: 'Petco Park'               },
};

// Platoon multipliers on hit rate (opposite-hand matchups favour the batter)
const PLATOON = {
  RvR: 1.00, RvL: 1.00,
  LvL: 1.00, LvR: 1.00,
  SvR: 1.00, SvL: 1.00,  // audit has not shown a reliable hit-rate edge here
};

// ─── Utilities ────────────────────────────────────────────────────────────────

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function applyLogitOffset(probability, offset = 0) {
  const p = clamp(Number(probability) || 0, 0.0001, 0.9999);
  const odds = p / (1 - p);
  return clamp((odds * Math.exp(offset)) / (1 + (odds * Math.exp(offset))), 0.0001, 0.9999);
}

function hitDisplayProbability(rankProb) {
  return applyLogitOffset(rankProb, HIT_DISPLAY_LOGIT_OFFSET);
}

function shrink(value, baseline, sample, prior) {
  const n = Math.max(0, Number(sample) || 0);
  return ((value * n) + (baseline * prior)) / (n + prior);
}

function splitKeyForHand(hand) {
  return hand === 'L' ? 'vl' : 'vr';
}

function parseSplitStats(d) {
  const out = {};
  for (const split of d.stats?.[0]?.splits || []) {
    const code = split.split?.code;
    const s = split.stat || {};
    if (!code) continue;
    const pa = parseInt(s.plateAppearances || s.battersFaced || s.atBats || '0', 10);
    const ab = parseInt(s.atBats || '0', 10);
    const hits = parseInt(s.hits || '0', 10);
    const so = parseInt(s.strikeOuts || '0', 10);
    const hr = parseInt(s.homeRuns || '0', 10);
    out[code] = {
      pa,
      ab,
      hits,
      hr,
      avg: parseFloat(s.avg || '0'),
      ops: parseFloat(s.ops || '0'),
      slg: parseFloat(s.slg || '0'),
      whip: parseFloat(s.whip || String(LEAGUE.whip)),
      kPct: pa > 0 ? so / pa : LEAGUE.kPct,
      hPerPa: pa > 0 ? hits / pa : LEAGUE.hPerPa,
      hrPerPa: pa > 0 ? hr / pa : 0,
    };
  }
  return out;
}

function todayStr() { return new Date().toLocaleDateString('en-CA'); }

function recentStartDate(days = 15) {
  const d = new Date();
  d.setDate(d.getDate() - days);
  return d.toLocaleDateString('en-CA');
}

function addDays(dateStr, days) {
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() + days);
  return d.toLocaleDateString('en-CA');
}

function formatDate(s) {
  return new Date(s + 'T12:00:00').toLocaleDateString('en-US', {
    weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
  });
}

function formatTime(iso) {
  return new Date(iso).toLocaleTimeString('en-US', {
    hour: 'numeric', minute: '2-digit', timeZoneName: 'short'
  });
}

function gameStatusNote(g) {
  const text = g.status?.detailedState || g.status?.reason || '';
  return /delay|rain|postpone/i.test(text) ? text : '';
}

function isPlayableGame(g) {
  const state = g.status?.abstractGameState;
  const code = g.status?.statusCode;
  return state === 'Preview' || state === 'Live' || code === 'S' || code === 'P' || code === 'I';
}

async function fetchJSON(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

function setStage(msg) {
  const el = document.getElementById('stage-msg');
  if (el) el.textContent = msg;
}

function setUpdatedAt(value = new Date()) {
  const el = document.getElementById('updated-at');
  if (!el) return;
  el.textContent = `Updated ${value.toLocaleTimeString('en-US', {
    hour: 'numeric',
    minute: '2-digit',
    timeZoneName: 'short',
  })}`;
}

// ─── MLB API ──────────────────────────────────────────────────────────────────

async function getSchedule(date) {
  const d = await fetchJSON(
    `${API}/schedule?sportId=1&date=${date}&hydrate=probablePitcher,lineups,team`
  );
  return d.dates?.[0]?.games || [];
}

const personCache = new Map();

async function getPersonInfo(id) {
  if (personCache.has(id)) return personCache.get(id);
  try {
    const d = await fetchJSON(`${API}/people/${id}`);
    const p = d.people?.[0] || {};
    const info = {
      batSide: p.batSide?.code || null,
      pitchHand: p.pitchHand?.code || null,
    };
    personCache.set(id, info);
    return info;
  } catch {
    const info = { batSide: null, pitchHand: null };
    personCache.set(id, info);
    return info;
  }
}

// Season stats + handedness in two parallel calls
async function getPitcherInfo(id) {
  try {
    const [sd, pd, sp] = await Promise.all([
      fetchJSON(`${API}/people/${id}/stats?stats=season&season=${SEASON}&group=pitching`),
      getPersonInfo(id),
      fetchJSON(`${API}/people/${id}/stats?stats=statSplits&season=${SEASON}&group=pitching&sitCodes=vl,vr`),
    ]);
    const s  = sd.stats?.[0]?.splits?.[0]?.stat || {};
    const ip = parseFloat(s.inningsPitched || '0');
    return {
      hand: pd.pitchHand || 'R',
      obaa: parseFloat(s.avg   || String(LEAGUE.ba)),
      era:  parseFloat(s.era   || String(LEAGUE.era)),
      whip: parseFloat(s.whip  || String(LEAGUE.whip)),
      k9:   ip > 0 ? (parseInt(s.strikeOuts || '0') / ip * 9) : LEAGUE.k9,
      ip,
      splits: parseSplitStats(sp),
    };
  } catch {
    return { hand: 'R', obaa: LEAGUE.ba, era: LEAGUE.era, whip: LEAGUE.whip, k9: LEAGUE.k9, ip: 0 };
  }
}

// Season hitting stats
async function getBatterStats(id) {
  try {
    const [d, sp] = await Promise.all([
      fetchJSON(`${API}/people/${id}/stats?stats=season&season=${SEASON}&group=hitting`),
      fetchJSON(`${API}/people/${id}/stats?stats=statSplits&season=${SEASON}&group=hitting&sitCodes=vl,vr,a`),
    ]);
    const s = d.stats?.[0]?.splits?.[0]?.stat;
    if (!s) return null;
    const ab = parseInt(s.atBats          || '0', 10);
    const pa = parseInt(s.plateAppearances || s.atBats || '0', 10);
    const h  = parseInt(s.hits            || '0', 10);
    const so = parseInt(s.strikeOuts       || '0', 10);
    return {
      avg:  parseFloat(s.avg || '0'),
      ops:  parseFloat(s.ops || '0'),
      obp:  parseFloat(s.obp || '0'),
      slg:  parseFloat(s.slg || '0'),
      ab,
      pa,
      hits: h,
      hPerPa: pa > 0 ? h / pa : LEAGUE.hPerPa,
      kPct: pa > 0 ? so / pa : LEAGUE.kPct,
      splits: parseSplitStats(sp),
    };
  } catch { return null; }
}

async function getBatterHand(id) {
  const info = await getPersonInfo(id);
  return info.batSide || 'R';
}

// Last-15-day hitting sample
async function getBatterRecent(id, startDate, endDate) {
  try {
    const d = await fetchJSON(
      `${API}/people/${id}/stats?stats=byDateRange&season=${SEASON}&group=hitting` +
      `&startDate=${startDate}&endDate=${endDate}`
    );
    const s = d.stats?.[0]?.splits?.[0]?.stat;
    if (!s) return null;
    const ab = parseInt(s.atBats || '0', 10);
    const pa = parseInt(s.plateAppearances || s.atBats || '0', 10);
    const h  = parseInt(s.hits || '0', 10);
    if (ab < 8 || pa <= 0) return null;
    return {
      avg: parseFloat(s.avg || '0'),
      ab,
      pa,
      hPerPa: h / pa,
    };
  } catch { return null; }
}

// ─── Scoring ──────────────────────────────────────────────────────────────────
//
// P(hit per PA) = batterBase × pitcherWeakness × platoon × park × gameEnv
// P(≥1 hit)    = 1 − (1 − pHit)^expectedPAs
//
// batterBase = season_BA × opsAdj × recentAdj × contactAdj
//
// pitcherWeakness (>1 = easier than league avg):
//   oBAA × 0.40 + K9(inv) × 0.25 + WHIP × 0.14 + ERA × 0.11 + recentERA × 0.10

function expectedPAs(lineupPos) {
  // 1-indexed batting order position
  const table = [4.7, 4.5, 4.3, 4.1, 4.0, 3.9, 3.8, 3.6, 3.5];
  return table[clamp(lineupPos - 1, 0, 8)];
}

function ttoFactor(lineupPos) {
  const pos = Number(lineupPos);
  if (!Number.isFinite(pos)) return 1.0;
  if (pos <= 3) return 1.065;
  if (pos <= 5) return 1.030;
  if (pos <= 6) return 1.005;
  return 1.0;
}

function calibrateProbability(rawProb, ePAs) {
  const leagueProb = 1 - Math.pow(1 - LEAGUE.hPerPa, ePAs);
  return clamp(
    leagueProb + ((rawProb - leagueProb) * MODEL.calibrationDamp),
    0.22,
    0.88
  );
}

function average(values) {
  const nums = values.filter(v => Number.isFinite(v));
  if (!nums.length) return null;
  return nums.reduce((sum, v) => sum + v, 0) / nums.length;
}

function hitGameEnvironmentFactors(candidates) {
  const grouped = new Map();
  for (const pick of candidates) {
    if (!grouped.has(pick.gamePk)) grouped.set(pick.gamePk, []);
    grouped.get(pick.gamePk).push(pick);
  }

  const factors = new Map();
  for (const [gamePk, picks] of grouped.entries()) {
    const avgEnv = average(picks.map(p => p.pitcherWeakness));
    factors.set(gamePk, avgEnv == null ? 1.0 : clamp(shrink(avgEnv, 1.0, picks.length, 12), 0.99, 1.02));
  }
  return factors;
}

function score(batter, pitcher, parkFactor, batterHand, lineupPos, gameEnvFactor = 1.0, isAway = false, recentOptions = null) {
  const { hand: pitcherHand, obaa, era, whip, k9, recentERA } = pitcher;

  const platoonKey  = `${batterHand}v${pitcherHand}`;
  const platoon     = PLATOON[platoonKey] ?? 1.0;
  const matchupBatterHand = batterHand === 'S'
    ? (pitcherHand === 'L' ? 'R' : 'L')
    : batterHand;
  const batterSplit = batter.splits?.[splitKeyForHand(pitcherHand)] || null;
  const pitcherSplit = pitcher.splits?.[splitKeyForHand(matchupBatterHand)] || null;
  const awaySplit = isAway ? batter.splits?.a || null : null;

  // Batter factors
  const splitHPerPa = batterSplit
    ? shrink(batterSplit.hPerPa || LEAGUE.hPerPa, batter.hPerPa || LEAGUE.hPerPa, batterSplit.pa, 120)
    : (batter.hPerPa || LEAGUE.hPerPa);
  const seasonHPerPa = shrink(
    splitHPerPa,
    LEAGUE.hPerPa,
    Math.max(batter.pa || batter.ab || 0, batterSplit?.pa || 0),
    MODEL.batterPaPrior
  );
  const opsAdj = clamp(
    1 + 0.08 * ((batter.ops || LEAGUE.ops) - LEAGUE.ops) / LEAGUE.ops,
    0.92, 1.14
  );
  const recentWeight = Number.isFinite(recentOptions?.weight) ? recentOptions.weight : 0.15;
  const recentRate = batter.recentHPerPa != null && recentOptions?.shrinkSample
    ? shrink(
        batter.recentHPerPa,
        seasonHPerPa,
        batter.recentPa || batter.recentAb || 0,
        MODEL.recentPaPrior
      )
    : batter.recentHPerPa;
  const recentAdj = recentRate != null
    ? clamp(
        1 + recentWeight * (recentRate - seasonHPerPa) / Math.max(seasonHPerPa, 0.05),
        Number.isFinite(recentOptions?.clampMin) ? recentOptions.clampMin : 0.90,
        Number.isFinite(recentOptions?.clampMax) ? recentOptions.clampMax : 1.10
      )
    : 1.0;
  const contactAdj = clamp(
    1 + 0.25 * (((1 - (batter.kPct ?? LEAGUE.kPct)) / (1 - LEAGUE.kPct)) - 1),
    0.92, 1.08
  );
  const awayAdj = 1.0;

  const batterBase = seasonHPerPa * opsAdj * recentAdj * contactAdj;

  // Pitcher weakness relative to league (each ratio > 1 = easier to hit)
  const splitObaa = pitcherSplit
    ? shrink(pitcherSplit.avg || LEAGUE.ba, obaa || LEAGUE.ba, pitcherSplit.pa, 120)
    : obaa;
  const splitWhip = pitcherSplit
    ? shrink(pitcherSplit.whip || LEAGUE.whip, whip || LEAGUE.whip, pitcherSplit.pa, 120)
    : whip;
  const splitK9 = pitcherSplit?.pa
    ? clamp(k9 * ((1 - LEAGUE.kPct) / Math.max(1 - pitcherSplit.kPct, 0.35)), 3, 16)
    : k9;
  const recentERAVal = recentERA != null
    ? shrink(recentERA, era || LEAGUE.era, pitcher.recentIp || 0, 18)
    : era;
  const rawPitcherWeakness = clamp(
    (splitObaa     / LEAGUE.ba)   * 0.40 +
    (LEAGUE.k9     / Math.max(splitK9, 1)) * 0.25 +
    (splitWhip     / LEAGUE.whip) * 0.14 +
    (era           / LEAGUE.era)  * 0.11 +
    (recentERAVal  / LEAGUE.era)  * 0.10,
    0.65, 1.55
  );
  const basePitcherWeakness =
    shrink(rawPitcherWeakness, 1.0, pitcher.ip || 0, MODEL.pitcherIpPrior) * ttoFactor(lineupPos);
  const pitcherWeakness = clamp(
    basePitcherWeakness > 1
      ? 1 + ((basePitcherWeakness - 1) * 0.75)
      : basePitcherWeakness,
    0.78, 1.25
  );

  const parkAdj = 1.0;
  const pHit  = clamp(batterBase * pitcherWeakness * platoon * parkAdj * gameEnvFactor, 0.04, MODEL.maxPerPaHit);
  const ePAs  = expectedPAs(lineupPos);
  const rawProb = 1 - Math.pow(1 - pHit, ePAs);
  const prob = calibrateProbability(rawProb, ePAs);
  const rankProb = prob;
  const displayProb = hitDisplayProbability(rankProb);

  return {
    prob: rankProb, rankProb, displayProb, rawProb, pHit, seasonHPerPa, platoon, pitcherWeakness, parkFactor, parkAdj,
    opsAdj, recentAdj, contactAdj, awayAdj, ttoAdj: ttoFactor(lineupPos), gameEnvFactor, ePAs,
    batterHand, pitcherHand, batterSplit, pitcherSplit, awaySplit, isAway,
  };
}

const CLASSIC_PLATOON = {
  RvR: 0.96, RvL: 1.06,
  LvL: 0.94, LvR: 1.07,
  SvR: 1.04, SvL: 1.04,
};

function classicScore(batter, pitcher, parkFactor, batterHand, lineupPos) {
  const { hand: pitcherHand, obaa, era, whip, k9, recentERA } = pitcher;
  const platoon = CLASSIC_PLATOON[`${batterHand}v${pitcherHand}`] ?? 1.0;
  const opsAdj = clamp(
    1 + 0.12 * ((batter.ops || LEAGUE.ops) - LEAGUE.ops) / LEAGUE.ops,
    0.85, 1.18
  );
  const recentAdj = batter.recentAvg != null
    ? clamp(1 + 0.35 * (batter.recentAvg - batter.avg) / Math.max(batter.avg, 0.05), 0.65, 1.45)
    : 1.0;
  const contactAdj = clamp(
    (1 - (batter.kPct ?? LEAGUE.kPct)) / (1 - LEAGUE.kPct),
    0.80, 1.20
  );
  const batterBase = (batter.avg || LEAGUE.ba) * opsAdj * recentAdj * contactAdj;
  const pitcherWeakness = clamp(
    ((obaa || LEAGUE.ba) / LEAGUE.ba) * 0.30 +
    ((era || LEAGUE.era) / LEAGUE.era) * 0.20 +
    ((whip || LEAGUE.whip) / LEAGUE.whip) * 0.20 +
    (LEAGUE.k9 / Math.max(k9 || LEAGUE.k9, 1)) * 0.15 +
    ((recentERA ?? era ?? LEAGUE.era) / LEAGUE.era) * 0.15,
    0.40, 2.20
  );
  const pHit = clamp(batterBase * pitcherWeakness * platoon * parkFactor, 0.05, 0.65);
  const ePAs = expectedPAs(lineupPos);
  const rawProb = 1 - Math.pow(1 - pHit, ePAs);
  // Classic is retained as a ranking experiment. Its historical probability
  // scale is invalid, so the UI suppresses a classic percentage until a
  // separately validated display calibrator exists.
  return {
    prob: rawProb,
    rankProb: rawProb,
    displayProb: null,
    rawProb,
    pHit,
    opsAdj,
    recentAdj,
    contactAdj,
    platoon,
    pitcherWeakness,
  };
}

// ─── Rendering ────────────────────────────────────────────────────────────────

function fmtAvg(n) {
  if (!n || isNaN(n) || n === 0) return '.---';
  return n.toFixed(3).replace(/^0/, '');
}

function fmtNum(n, dec = 2) {
  if (n == null || n === '' || isNaN(n)) return '—';
  return n.toFixed(dec);
}

function fcls(v, goodAbove1 = true) {
  const d = v - 1;
  if (Math.abs(d) < 0.025) return 'neutral';
  return (goodAbove1 ? d > 0 : d < 0) ? 'good' : 'bad';
}

function farrow(v, goodAbove1 = true) {
  const d = v - 1;
  if (Math.abs(d) < 0.025) return '→ Neutral';
  const pct = Math.round(Math.abs(d) * 100);
  const dir  = (goodAbove1 ? d > 0 : d < 0) ? '▲' : '▼';
  return `${dir} ${pct}%`;
}

function platoonLabel(b, p) {
  const bat = b === 'S' ? 'Switch' : b === 'L' ? 'Left' : 'Right';
  const pit = p === 'L' ? 'left-handed pitcher' : 'right-handed pitcher';
  return `${bat}-handed hitter vs ${pit}`;
}

function joinReasons(reasons) {
  if (reasons.length <= 1) return reasons.join('');
  return `${reasons.slice(0, -1).join(', ')} and ${reasons[reasons.length - 1]}`;
}

function hitPickSummary(pick) {
  const reasons = [];
  if (pick.lineupPos <= 3) reasons.push('he bats near the top, so he should get more chances');
  if (pick.pitcherWeakness > 1.06) reasons.push('the opposing pitcher looks hittable');
  if (pick.contactAdj > 1.03) reasons.push('he avoids strikeouts well');
  if (pick.platoon > 1.02) reasons.push('the handedness matchup helps him');
  if (pick.ttoAdj > 1.01) reasons.push('his lineup spot gives him a better shot at seeing a tiring starter');
  if (pick.gameEnvFactor > 1.015) reasons.push('this specific game looks hitter-friendly overall');
  if (pick.gameEnvFactor < 0.985) reasons.push('this specific game looks tougher for hits overall');
  if (!reasons.length) reasons.push('his overall hit profile grades out well compared with the slate');
  return `Why this pick: ${joinReasons(reasons)}.`;
}

    ? Math.round(pick.classicDisplayProb * 100)

  const parkInfo = PARK[pick.homeTeamId];

  return `

  <div class="bet-input-row">
    <label>American odds
      <input type="number" value="${pick.offeredAmericanOdds ?? ''}" placeholder="+120" oninput="setHitPickOdds('${pick.key}', this.value)">
    </label>
    <label><input type="checkbox" ${pick.betPlaced ? 'checked' : ''} onchange="setHitBetPlaced('${pick.key}', this.checked)"> Bet placed</label>
  </div>

  <div class="matchup-line">vs ${pick.pitcherName} (${pick.pitcherHand === 'L' ? 'lefty pitcher' : 'righty pitcher'})</div>
  <div class="game-time">${pick.gameTime} · ${pick.venue}</div>
  ${pick.statusNote ? `<div class="status-alert">${pick.statusNote}</div>` : ''}
  <div class="card-summary">${hitPickSummary(pick)}</div>

  <div class="stat-group-label">Hitter</div>

    <div class="stat">

      <div class="stat-value">${fmtAvg(pick.seasonHPerPa)}</div>
      <div class="stat-label">Safer hit rate</div>
    </div>

      <div class="stat-label">On-base + power</div>

      <div class="stat-value">${hasRecent ? fmtAvg(pick.batter.recentAvg) : '—'}</div>

  </div>

  <div class="stat-group-label">Opposing pitcher</div>
  <div class="stats-row">
    <div class="stat">
      <div class="stat-value">${fmtAvg(pick.pitcher.obaa)}</div>

    </div>

  <div class="factors">

    <div class="factor">

      <span class="factor-val ${pwCls}">${pwCls === 'good' ? 'Hittable' : pwCls === 'bad' ? 'Tough' : 'Average'} ${farrow(pick.pitcherWeakness)}</span>

}

  const rows = picks.map((pick, i) => {
    return `
    ${i === 0 ? '<div class="summary-tier">Current top-10 picks selected by both models</div>' : ''}
    <div class="summary-row">

      <div class="summary-name">${pick.batterName}
        <div class="model-compare">
          <span class="model-chip current">Cur #${pick.currentRank ?? '?'}</span>

        </div>
      </div>
      <div class="summary-time">${pick.gameTime || ''}</div>
      <div class="summary-pct">${Math.round((pick.displayProb ?? pick.prob) * 100)}%</div>
    </div>`;
  }).join('');

  return `
<div class="summary-list">
  <div class="summary-title">Quick Picks</div>

</div>`;
}

function renderHitWatchlist(shadowPicks) {
  const currentOnly = shadowPicks
    .filter(pick => pick.inCurrentTop === true && pick.inClassicTop !== true)
    .sort((a, b) => (a.currentRank || 999) - (b.currentRank || 999));
  if (!currentOnly.length) return '';
  return `
<details class="summary-list">
  <summary class="summary-title">Current-only watchlist (${currentOnly.length})</summary>
  <div class="summary-tier">Not primary recommendations; retained for comparison</div>
  ${currentOnly.map(pick => `
    <div class="summary-row">
      <div class="summary-rank">#${pick.currentRank ?? '?'}</div>
      <div class="summary-name">${pick.batterName}</div>
      <div class="summary-time">${pick.gameTime || ''}</div>
      <div class="summary-pct">${pctText(pick.displayProb ?? pick.prob)}</div>
    </div>`).join('')}
</details>`;
}

function getPickHistory() {
  try {
    return JSON.parse(localStorage.getItem(PICK_HISTORY_KEY) || '{}');
  } catch {
    return {};
  }
}

function setHitPickOdds(key, value) {
  const pick = currentTopPicks.find(item => item.key === key);
  if (!pick) return;
  pick.offeredAmericanOdds = value === '' ? '' : Number(value);
  updateSavedHitBetFields(pick);
  savePageCache();
}

function setHitBetPlaced(key, checked) {
  const pick = currentTopPicks.find(item => item.key === key);
  if (!pick) return;
  pick.betPlaced = checked === true;
  updateSavedHitBetFields(pick);
  savePageCache();
}

function updateSavedHitBetFields(pick) {
  if (!currentPickDate) return;
  const saved = getSavedPicksForDate(currentPickDate);
  if (!saved?.picks?.length) return;
  const identity = pickIdentity(pick);
  const savedPick = saved.picks.find(item => pickIdentity(item) === identity);
  if (!savedPick) return;
  savedPick.offeredAmericanOdds = pick.offeredAmericanOdds ?? '';
  savedPick.betPlaced = pick.betPlaced === true;
  storePickPayload(saved);
}

function pickIdentity(pick) {
  if (pick?.gamePk != null && pick?.batterId != null) {
    return `${pick.gamePk}:${pick.batterId}`;
  }
  return [
    pick?.gamePk || 'unknown-game',
    pick?.side || '',
    pick?.batterTeam || '',
    pick?.batterName || 'unknown-player',
  ].join(':').toLowerCase();
}

function hitPredictionId(date, pick) {
  return `hit:${date || 'unknown-date'}:${pickIdentity(pick)}`;
}

function pickCaptureRun(pick) {
  const run = Number.parseInt(pick?.captureRun, 10);
  return Number.isFinite(run) && run > 0 ? run : 1;
}

function hasHitTrackingRows(payload) {
  return !!(payload?.picks?.length || payload?.shadowPicks?.length);
}

function normalizeSavedPickPayload(payload) {
  if (!payload?.date) return payload || null;
  const fallbackCapturedAt = payload.firstSavedAt || payload.savedAt || '';
  const picks = (payload.picks || []).map(pick => ({
    ...pick,
    key: pick.key || pickIdentity(pick),
    capturedAt: pick.capturedAt || fallbackCapturedAt,
    captureRun: pickCaptureRun(pick),
    predictionId: pick.predictionId || hitPredictionId(payload.date, pick),
  }));
  const shadowPicks = (payload.shadowPicks || []).map(pick => ({
    ...pick,
    rank: null,
    key: pick.key || pickIdentity(pick),
    capturedAt: pick.capturedAt || fallbackCapturedAt,
    captureRun: pickCaptureRun(pick),
    predictionId: pick.predictionId || hitPredictionId(payload.date, pick),
  }));
  const trackedRows = [...picks, ...shadowPicks];
  const captureCount = Math.max(
    Number.parseInt(payload.captureCount, 10) || 0,
    trackedRows.length ? 1 : 0,
    ...trackedRows.map(pickCaptureRun)
  );
  return {
    ...payload,
    firstSavedAt: fallbackCapturedAt,
    modelMetadataVersion: Math.max(payload.modelMetadataVersion || 1, 4),
    captureCount,
    picks,
    shadowPicks,
  };
}

function savedCaptureCount(payload) {
  return normalizeSavedPickPayload(payload)?.captureCount || 0;
}

function getSavedPicksForDate(date) {
  return normalizeSavedPickPayload(getPickHistory()[date] || null);
}

function getLatestSavedPicks() {
  return pickSavedPayload(getPickHistory());
}

function getLatestPastSavedPicks() {
  return pickSavedPayload(getPickHistory(), { pastOnly: true });
}

function getSavedPicksForResults() {
  return (currentPickDate && getSavedPicksForDate(currentPickDate)) || getLatestPastSavedPicks() || getLatestSavedPicks();
}

function pickSavedPayload(history, options = {}) {
  const values = Object.values(history || {})
    .map(normalizeSavedPickPayload)
    .filter(p => p?.date && hasHitTrackingRows(p));
  if (!values.length) return null;
  values.sort((a, b) => b.date.localeCompare(a.date));
  if (options.pastOnly) {
    const today = todayStr();
    return values.find(p => p.date < today) || null;
  }
  return values[0];
}

function storePickPayload(payload) {
  const normalized = normalizeSavedPickPayload(payload);
  const history = getPickHistory();
  history[normalized.date] = normalized;
  localStorage.setItem(PICK_HISTORY_KEY, JSON.stringify(history));
  localStorage.setItem(PICK_STORE_KEY, JSON.stringify(normalized));
  return normalized;
}

function savedStateStamp(date = currentPickDate) {
  const saved = date ? getSavedPicksForDate(date) : null;
  return saved?.savedAt || '';
}

function hasSavedPicksForDate(date) {
  return !!getPickHistory()[date];
}

function limitSameGameAndTeam(picks, limit = 2) {
  const gameCounts = new Map();
  const teamCounts = new Map();
  const selected = [];

  for (const pick of picks) {
    const gameKey = pick.gamePk;
    const teamKey = pick.batterTeam;
    if ((gameCounts.get(gameKey) || 0) >= limit) continue;
    if ((teamCounts.get(teamKey) || 0) >= limit) continue;
    selected.push(pick);
    gameCounts.set(gameKey, (gameCounts.get(gameKey) || 0) + 1);
    teamCounts.set(teamKey, (teamCounts.get(teamKey) || 0) + 1);
    if (selected.length >= MODEL.topPickCount) break;
  }

  return selected;
}

function rankPicks(picks, field, rankField) {
  [...picks]
    .sort((a, b) => b[field] - a[field])
    .forEach((pick, i) => { pick[rankField] = i + 1; });
}

function isConsensusPick(pick) {
  return pick.inCurrentTop === true && pick.inClassicTop === true;
}

function compareHitDisplayPicks(a, b) {
  const consensusOrder = Number(isConsensusPick(b)) - Number(isConsensusPick(a));
  if (consensusOrder) return consensusOrder;
  return ((b.rankProb ?? b.prob) - (a.rankProb ?? a.prob))
    || ((a.currentRank || 999) - (b.currentRank || 999))
    || ((a.classicRank || 999) - (b.classicRank || 999));
}

function hitModelPickLists(picks) {
  const currentTop = limitSameGameAndTeam(
    [...picks].sort((a, b) => (b.rankProb ?? b.prob) - (a.rankProb ?? a.prob)),
    2
  );
  const classicTop = limitSameGameAndTeam(
    [...picks].sort((a, b) => (b.classicRankProb ?? b.classicProb) - (a.classicRankProb ?? a.classicProb)),
    2
  );
  const merged = new Map();

  for (const pick of currentTop) merged.set(pick.key, { ...pick, inCurrentTop: true, inClassicTop: false });
  for (const pick of classicTop) {
    const existing = merged.get(pick.key);
    if (existing) existing.inClassicTop = true;
    else merged.set(pick.key, { ...pick, inCurrentTop: false, inClassicTop: true });
  }

  const union = [...merged.values()].sort(compareHitDisplayPicks);
  const primary = union
    .filter(pick => isConsensusPick(pick) && (pick.currentRank || 999) <= MODEL.topPickCount)
    .sort((a, b) => (a.currentRank || 999) - (b.currentRank || 999));
  const primaryKeys = new Set(primary.map(pick => pick.key));
  const shadow = union
    .filter(pick => !primaryKeys.has(pick.key))
    .map(pick => ({
      ...pick,
      selectionTier: pick.inCurrentTop ? 'current-watchlist' : 'classic-only',
    }));

  return { primary, shadow, union };
}

function scoreHitRecencyShadows(candidates, gameEnvFactors) {
  const variants = [
    { field: 'recent15RankProb', rank: 'recent15Rank', weight: 0.15, shrinkSample: true },
    { field: 'recent05RankProb', rank: 'recent05Rank', weight: 0.05, shrinkSample: false },
    { field: 'recent00RankProb', rank: 'recent00Rank', weight: 0.00, shrinkSample: false },
  ];

  for (const pick of candidates) {
    const gameEnvFactor = gameEnvFactors.get(pick.gamePk) ?? 1.0;
    for (const variant of variants) {
      const shadow = score(
        pick.batter,
        pick.pitcher,
        pick.parkFactor,
        pick.batterHand,
        pick.lineupPos,
        gameEnvFactor,
        pick.side === 'away',
        { weight: variant.weight, shrinkSample: variant.shrinkSample }
      );
      pick[variant.field] = shadow.rankProb;
    }
    pick.recentSamplePa = pick.batter?.recentPa ?? null;
  }

  for (const variant of variants) rankPicks(candidates, variant.field, variant.rank);
}

function hitShadowTrackingPicks(candidates, lists) {
  const primaryByKey = new Map(lists.primary.map(pick => [pick.key, pick]));
  const unionByKey = new Map(lists.union.map(pick => [pick.key, pick]));
  const tracked = new Map(lists.shadow.map(pick => [pick.key, { ...pick }]));
  const variants = [
    { field: 'recent15RankProb', flag: 'inRecent15Top', label: 'recent-0.15-shrunk' },
    { field: 'recent05RankProb', flag: 'inRecent05Top', label: 'recent-0.05-unshrunk' },
    { field: 'recent00RankProb', flag: 'inRecent00Top', label: 'recent-0' },
  ];

  for (const variant of variants) {
    const top = limitSameGameAndTeam(
      [...candidates].sort((a, b) => b[variant.field] - a[variant.field]),
      2
    );
    for (const pick of top) {
      const primary = primaryByKey.get(pick.key);
      if (primary) {
        primary[variant.flag] = true;
        continue;
      }
      const existing = tracked.get(pick.key) || { ...pick, ...(unionByKey.get(pick.key) || {}) };
      existing[variant.flag] = true;
      const labels = new Set(String(existing.selectionTier || '').split(',').filter(Boolean));
      labels.add(variant.label);
      existing.selectionTier = [...labels].join(',');
      tracked.set(pick.key, existing);
    }
  }

  return [...tracked.values()];
}

function pickPayload(pick, idx, capturedAt, captureRun, date = currentPickDate, options = {}) {
  return {
    key: pick.key || pickIdentity(pick),
    rank: options.isShadow ? null : idx + 1,
    currentRank: Number.isFinite(pick.currentRank) ? pick.currentRank : null,
    classicRank: Number.isFinite(pick.classicRank) ? pick.classicRank : null,
    classicProb: Number.isFinite(pick.classicRankProb ?? pick.classicProb) ? (pick.classicRankProb ?? pick.classicProb) : null,
    classicRankProb: Number.isFinite(pick.classicRankProb ?? pick.classicProb) ? (pick.classicRankProb ?? pick.classicProb) : null,
    classicDisplayProb: Number.isFinite(pick.classicDisplayProb) ? pick.classicDisplayProb : null,
    inCurrentTop: pick.inCurrentTop === true,
    inClassicTop: pick.inClassicTop === true,
    inRecent15Top: pick.inRecent15Top === true,
    inRecent05Top: pick.inRecent05Top === true,
    inRecent00Top: pick.inRecent00Top === true,
    gamePk: pick.gamePk,
    side: pick.side,
    batterId: pick.batterId,
    batterName: pick.batterName,
    batterTeam: pick.batterTeam,
    pitcherName: pick.pitcherName,
    pitcherHand: pick.pitcherHand,
    lineupPos: pick.lineupPos,
    prob: pick.rankProb ?? pick.prob,
    rankProb: pick.rankProb ?? pick.prob,
    displayProb: pick.displayProb ?? pick.prob,
    rawProb: pick.rawProb,
    pHit: pick.pHit,
    pitcherWeakness: pick.pitcherWeakness,
    platoon: pick.platoon,
    awayAdj: pick.awayAdj,
    ttoAdj: pick.ttoAdj,
    gameEnvFactor: pick.gameEnvFactor,
    parkFactor: pick.parkFactor,
    parkAdj: pick.parkAdj ?? pick.parkFactor,
    recentAdj: pick.recentAdj,
    recent15Rank: pick.recent15Rank,
    recent15RankProb: pick.recent15RankProb,
    recent05Rank: pick.recent05Rank,
    recent05RankProb: pick.recent05RankProb,
    recent00Rank: pick.recent00Rank,
    recent00RankProb: pick.recent00RankProb,
    recentSamplePa: pick.batter?.recentPa ?? pick.recentSamplePa ?? null,
    contactAdj: pick.contactAdj,
    opsAdj: pick.opsAdj,
    gameTime: pick.gameTime,
    venue: pick.venue,
    selectionTier: pick.selectionTier || 'primary',
    calibrationOffset: HIT_DISPLAY_LOGIT_OFFSET,
    offeredAmericanOdds: pick.offeredAmericanOdds ?? '',
    betPlaced: pick.betPlaced === true,
    capturedAt,
    captureRun,
    predictionId: hitPredictionId(date, pick),
  };
}

function currentPickPayload(capturedAt = new Date().toISOString(), captureRun = 1) {
  return {
    date: currentPickDate,
    savedAt: capturedAt,
    firstSavedAt: capturedAt,
    modelMetadataVersion: 4,
    captureCount: captureRun,
    picks: currentTopPicks.map((pick, idx) =>
      pickPayload(pick, idx, capturedAt, captureRun, currentPickDate)
    ),
    shadowPicks: currentHitShadowPicks.map((pick, idx) =>
      pickPayload(pick, idx, capturedAt, captureRun, currentPickDate, { isShadow: true })
    ),
  };
}

function appendCurrentPickPayload(existing) {
  const saved = normalizeSavedPickPayload(existing);
  const capturedAt = new Date().toISOString();
  const captureRun = savedCaptureCount(saved) + 1;
  const incoming = currentTopPicks.map((pick, idx) =>
    pickPayload(pick, idx, capturedAt, captureRun, currentPickDate)
  );
  const incomingShadow = currentHitShadowPicks.map((pick, idx) =>
    pickPayload(pick, idx, capturedAt, captureRun, currentPickDate, { isShadow: true })
  );
  const seen = new Set(saved.picks.map(pickIdentity));
  const added = [];

  for (const pick of incoming) {
    const identity = pickIdentity(pick);
    if (seen.has(identity)) continue;
    seen.add(identity);
    added.push(pick);
  }

  const primaryIdentities = new Set([...saved.picks, ...added].map(pickIdentity));
  const shadowByIdentity = new Map(
    (saved.shadowPicks || []).map(pick => [pickIdentity(pick), pick])
  );
  for (const identity of primaryIdentities) shadowByIdentity.delete(identity);
  let shadowAddedCount = 0;
  let shadowUpdatedCount = 0;
  for (const pick of incomingShadow) {
    const identity = pickIdentity(pick);
    if (primaryIdentities.has(identity)) continue;
    if (shadowByIdentity.has(identity)) shadowUpdatedCount += 1;
    else shadowAddedCount += 1;
    shadowByIdentity.set(identity, pick);
  }

  if (!added.length && !shadowAddedCount && !shadowUpdatedCount) {
    return {
      payload: saved,
      addedCount: 0,
      shadowAddedCount: 0,
      shadowUpdatedCount: 0,
      duplicateCount: incoming.length,
      captureRun: null,
    };
  }

  return {
    payload: {
      ...saved,
      savedAt: capturedAt,
      firstSavedAt: saved.firstSavedAt || saved.savedAt || capturedAt,
      modelMetadataVersion: 4,
      captureCount: captureRun,
      picks: [...saved.picks, ...added],
      shadowPicks: [...shadowByIdentity.values()],
    },
    addedCount: added.length,
    shadowAddedCount,
    shadowUpdatedCount,
    duplicateCount: incoming.length - added.length,
    captureRun,
  };
}

function saveCurrentPicks() {
  const out = document.getElementById('tracker-output');
  if (!currentPickDate || (!currentTopPicks.length && !currentHitShadowPicks.length)) {
    if (out) out.textContent = 'No primary picks or shadow candidates are loaded yet.';
    return;
  }

  const existing = getSavedPicksForDate(currentPickDate);
  if (hasHitTrackingRows(existing)) {
    const merged = appendCurrentPickPayload(existing);
    if (!merged.addedCount && !merged.shadowAddedCount && !merged.shadowUpdatedCount) {
      if (out) {
        out.textContent = `No new batter/game rows to add. The ${existing.picks.length} primary picks and ` +
          `${existing.shadowPicks.length} shadow candidates remain unchanged.`;
      }
      return;
    }
    const payload = storePickPayload(merged.payload);
    lastCheckedPickRows = null;
    lastCheckedPickDate = null;
    if (out) {
      out.textContent = `Added ${merged.addedCount} new picks in save round ${merged.captureRun}. ` +
        `Added ${merged.shadowAddedCount} and refreshed ${merged.shadowUpdatedCount} shadow candidates; ` +
        `kept ${payload.picks.length - merged.addedCount} earlier picks unchanged.`;
    }
    savePageCache();
    return;
  }

  const payload = storePickPayload(currentPickPayload());
  lastCheckedPickRows = null;
  lastCheckedPickDate = null;
  if (out) {
    out.textContent = `Saved ${payload.picks.length} primary picks and ${payload.shadowPicks.length} ` +
      `shadow candidates in save round 1 for ${formatDate(payload.date)}.`;
  }
  savePageCache();
}

function replaceCurrentPicks() {
  const out = document.getElementById('tracker-output');
  if (!currentPickDate || (!currentTopPicks.length && !currentHitShadowPicks.length)) {
    if (out) out.textContent = 'No primary picks or shadow candidates are loaded yet.';
    return;
  }

  const payload = storePickPayload(currentPickPayload());
  lastCheckedPickRows = null;
  lastCheckedPickDate = null;
  if (out) {
    out.textContent = `Replaced the saved slate for ${formatDate(payload.date)} with ${payload.picks.length} ` +
      `primary picks and ${payload.shadowPicks.length} shadow candidates in a new save round 1.`;
  }
  savePageCache();
}

function autoSaveCurrentPicks() {
  if (!currentPickDate || (!currentTopPicks.length && !currentHitShadowPicks.length)) return;
  if (hasSavedPicksForDate(currentPickDate)) return;
  storePickPayload(currentPickPayload());
}

function pctText(value) {
  return `${Math.round((value || 0) * 100)}%`;
}

function tsvCell(value) {
  return String(value ?? '').replace(/\t/g, ' ').replace(/\r?\n/g, ' ');
}

function rowsToTsvWithColumns(columns, rows) {
  return [columns, ...rows].map(row => row.map(tsvCell).join('\t')).join('\n');
}

function decText(value, places = 3) {
  return value == null || value === '' || isNaN(value) ? '' : Number(value).toFixed(places);
}

function savedModelSelection(pick) {
  if (pick.inCurrentTop === true && pick.inClassicTop === true) return 'both';
  if (pick.inCurrentTop === true) return 'current';
  if (pick.inClassicTop === true) return 'classic';
  return '';
}

function savedModelFlag(value) {
  return typeof value === 'boolean' ? (value ? 1 : 0) : '';
}

function savedPickToAnalysisRow(date, pick, result = '', hits = '', atBats = '', source = 'pick') {
  const outcome = result === 'Hit' ? 1 : result === 'Miss' ? 0 : '';
  const isAudit = source === 'audit';
  return [
    source,
    date,
    source === 'shadow' ? '' : pick.rank,
    pick.batterName,
    pick.batterTeam,
    pctText(pick.displayProb ?? pick.prob),
    result,
    outcome,
    hits,
    atBats,
    decText(pick.pHit),
    decText(pick.pitcherWeakness),
    decText(pick.platoon),
    decText(pick.awayAdj),
    decText(pick.ttoAdj),
    decText(pick.gameEnvFactor),
    decText(pick.parkAdj ?? pick.parkFactor),
    decText(pick.recentAdj),
    decText(pick.contactAdj),
    decText(pick.opsAdj),
    pick.lineupPos,
    pick.pitcherName,
    pick.pitcherHand === 'L' ? 'Lefty' : 'Righty',
    pick.venue,
    Number.isFinite(pick.currentRank) ? pick.currentRank : (isAudit ? pick.rank : ''),
    decText(pick.rankProb ?? pick.prob, 4),
    decText(pick.rankProb ?? pick.prob, 4),
    decText(pick.displayProb ?? pick.prob, 4),
    decText(pick.calibrationOffset ?? HIT_DISPLAY_LOGIT_OFFSET, 4),
    Number.isFinite(pick.classicRank) ? pick.classicRank : '',
    decText(pick.classicDisplayProb, 4),
    decText(pick.classicRankProb ?? pick.classicProb, 4),
    decText(pick.classicDisplayProb, 4),
    isAudit ? '' : savedModelFlag(pick.inCurrentTop),
    isAudit ? '' : savedModelFlag(pick.inClassicTop),
    isAudit ? '' : savedModelSelection(pick),
    isAudit ? '' : pick.capturedAt,
    isAudit ? '' : pickCaptureRun(pick),
    pick.gameTime || '',
    pick.gamePk || '',
    pick.batterId || '',
    isAudit ? '' : (pick.predictionId || hitPredictionId(date, pick)),
    isAudit ? 'audit' : (pick.selectionTier || (source === 'shadow' ? 'shadow' : 'primary')),
    isAudit ? '' : savedModelFlag(pick.inRecent15Top),
    isAudit ? '' : savedModelFlag(pick.inRecent05Top),
    isAudit ? '' : savedModelFlag(pick.inRecent00Top),
    Number.isFinite(pick.recent15Rank) ? pick.recent15Rank : '',
    decText(pick.recent15RankProb, 4),
    Number.isFinite(pick.recent05Rank) ? pick.recent05Rank : '',

}

async function copyTextToOutput(text, successMessage, outputId) {
  const out = document.getElementById(outputId);
  try {
    const clipboard = globalThis.navigator?.clipboard;
    if (clipboard?.writeText) {
      await clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    if (out) out.textContent = successMessage;
  } catch (e) {
    if (out) out.innerHTML = `<span class="bad">Copy failed: ${e.message}</span>`;
  }
}

async function copyText(text, successMessage) {
  const out = document.getElementById('tracker-output');
  try {
    const clipboard = globalThis.navigator?.clipboard;
    if (clipboard?.writeText) {

    }

  } catch (e) {
    if (out) out.innerHTML = `<span class="bad">Copy failed: ${e.message}</span>`;
  }
}

function renderSavedPickResults(saved, rows) {
  const completed = rows.filter(r => r.status !== 'pending');
  const hits = completed.filter(r => r.hit).length;
  const resultLabel = saved.picks.length ? 'primary picks' : 'shadow candidates';
  const brier = completed.length
    ? completed.reduce((sum, r) => sum + Math.pow(r.prob - (r.hit ? 1 : 0), 2), 0) / completed.length
    : 0;
  const list = rows.map(r => `
    <div class="pick-result-row">
      <span>R${r.captureRun} #${r.rank}</span>
      <span>${r.name}</span>
      <span class="${r.status === 'pending' ? 'neutral' : r.hit ? 'good' : 'bad'}">${r.status === 'pending' ? 'Pending' : r.hit ? `Hit ${r.hits}/${r.atBats}` : `Miss ${r.hits}/${r.atBats}`}</span>
    </div>`).join('');

  return `
    <div><strong>${formatDate(saved.date)}</strong></div>
    <div>${completed.length}/${rows.length} ${resultLabel} final. Hit rate: ${completed.length ? Math.round(hits / completed.length * 100) : 0}%. Brier: ${completed.length ? brier.toFixed(3) : 'n/a'}.</div>
    <div style="margin-top:8px">${list}</div>`;
}

async function checkSavedPicks(saved = getSavedPicksForResults(), missingText = 'No saved picks yet. Tap "Save new picks" first.') {
  const out = document.getElementById('tracker-output');
  if (!hasHitTrackingRows(saved)) {
    if (out) out.textContent = missingText;
    return;
  }

  const resultPicks = saved.picks.length ? saved.picks : saved.shadowPicks;

  if (out) out.textContent = 'Checking final boxscores...';

  try {
    const boxscores = new Map();
    await Promise.all([...new Set(resultPicks.map(p => p.gamePk).filter(Boolean))].map(async gamePk => {
      boxscores.set(gamePk, await getBoxscore(gamePk));
    }));

    const rows = resultPicks.map(pick => {
      const box = boxscores.get(pick.gamePk);
      const player = Object.values(box?.teams?.[pick.side]?.players || {})
        .find(p => p.person?.id === pick.batterId);
      const batting = player?.stats?.batting;
      return {
        rank: pick.rank,
        captureRun: pickCaptureRun(pick),
        name: pick.batterName,
        prob: pick.displayProb ?? pick.prob,
        status: batting ? 'final' : 'pending',
        hit: batting ? (batting.hits || 0) > 0 : false,
        hits: batting?.hits ?? '',
        atBats: batting?.atBats ?? '',
      };
    });

    lastCheckedPickRows = rows;
    lastCheckedPickDate = saved.date;
    if (out) out.innerHTML = renderSavedPickResults(saved, rows);
    savePageCache();
  } catch (e) {
    if (out) out.innerHTML = `<span class="bad">Could not check saved picks: ${e.message}</span>`;
  }
}

async function getSavedRowsWithResults(saved = getSavedPicksForResults()) {
  if (!hasHitTrackingRows(saved)) return null;

  const tracked = [
    ...saved.picks.map(pick => ({ pick, source: 'pick' })),
    ...(saved.shadowPicks || []).map(pick => ({ pick, source: 'shadow' })),
  ];
  const boxscores = new Map();
  await Promise.all([...new Set(tracked.map(row => row.pick.gamePk).filter(Boolean))].map(async gamePk => {
    boxscores.set(gamePk, await getBoxscore(gamePk));
  }));

  const rows = tracked.map(({ pick, source }) => {
    const box = boxscores.get(pick.gamePk);
    const player = Object.values(box?.teams?.[pick.side]?.players || {})
      .find(p => p.person?.id === pick.batterId);
    const batting = player?.stats?.batting;
    const hits = batting?.hits ?? '';
    const atBats = batting?.atBats ?? '';
    return {
      pick,
      status: batting ? 'final' : 'pending',
      result: batting ? (hits > 0 ? 'Hit' : 'Miss') : 'Pending',
      hits,
      atBats,
      source,
    };
  });

  return { saved, rows };
}

function renderBacktestResult(result) {
  const bucketRows = result.buckets.map(b => `
    <div class="bucket-row">
      <span>${b.label}</span>
      <span>${b.count ? `${Math.round(b.hitRate * 100)}% hit rate` : 'no picks'}</span>
      <span>${b.count} picks</span>
    </div>`).join('');

  return `
    <div><strong>${formatDate(result.date)}</strong></div>
    <div>${result.picks} batter-game picks across ${result.games} completed games.</div>
    <div>Brier score: ${result.brier.toFixed(3)} - Overall hit rate: ${Math.round(result.hitRate * 100)}%</div>
