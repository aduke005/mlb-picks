<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MLB HR Watchlist</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --blue: #58a6ff;
  --inset: #0d1117;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
  padding: 16px;
  padding-top: max(20px, env(safe-area-inset-top));
  padding-bottom: max(20px, env(safe-area-inset-bottom));
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
}

header { text-align: center; padding: 12px 0 18px; }

h1 {
  font-size: 1.55rem;
  font-weight: 750;
  color: var(--blue);
  letter-spacing: 0;
}

.subtitle { font-size: 0.82rem; color: var(--muted); margin-top: 5px; }
.subtitle a { color: var(--blue); text-decoration: none; }
.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-top: 12px;
}

.tab {
  display: block;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  text-decoration: none;
  padding: 9px 10px;
  border-radius: 8px;
  font-size: 0.86rem;
  font-weight: 650;
}

.tab.active {
  color: var(--text);
  border-color: var(--blue);
  background: var(--inset);
}

.top-actions {
  display: flex;
  justify-content: center;
  margin-top: 8px;
}

.top-refresh {
  width: 38px;
  height: 32px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--blue);
  border-radius: 8px;
  font-size: 1rem;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.1s, color 0.1s, border-color 0.1s;
  -webkit-tap-highlight-color: transparent;
}

.top-refresh:active {
  background: var(--blue);
  color: var(--bg);
  border-color: var(--blue);
}

.updated-at {
  font-size: 0.72rem;
  color: var(--muted);
  margin-top: 5px;
  min-height: 1em;
}

.summary-list {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin: 0 0 12px;
  overflow: hidden;
}

.summary-title {
  padding: 10px 12px;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  border-bottom: 1px solid var(--border);
}

.summary-row {
  display: grid;
  grid-template-columns: 42px 1fr 74px 58px;
  gap: 8px;
  align-items: center;
  min-height: 42px;
  padding: 8px 12px;
  border-top: 1px solid var(--border);
}

.summary-title + .summary-row { border-top: 0; }

.summary-tier {
  padding: 8px 12px 4px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 0.62rem;
  font-weight: 750;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.summary-title + .summary-tier { border-top: 0; }

.summary-rank {
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 700;
}

.summary-name {
  color: var(--text);
  font-size: 0.92rem;
  font-weight: 650;
  line-height: 1.15;
  overflow-wrap: anywhere;
}

.summary-time {
  color: var(--muted);
  font-size: 0.76rem;
  font-weight: 650;
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.summary-pct {
  color: var(--green);
  font-size: 1.0rem;
  font-weight: 800;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.model-compare {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 4px;
}

.model-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 2px 7px;
  color: var(--muted);
  font-size: 0.64rem;
  font-weight: 750;
  line-height: 1.4;
}

.model-chip.current { color: var(--green); }
.model-chip.classic { color: var(--blue); }

.note {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 0.78rem;
  line-height: 1.45;
}

.toolbar {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  margin: 0 0 12px;
}

.toolbar button {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--blue);
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 0.86rem;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.1s, color 0.1s, border-color 0.1s;
  -webkit-tap-highlight-color: transparent;
}

.toolbar button:active {
  background: var(--blue);
  color: var(--bg);
  border-color: var(--blue);
}

.tracker-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.tracker-actions button:last-child:nth-child(odd) {
  grid-column: 1 / -1;
}

.pick-result-row {
  display: grid;
  grid-template-columns: 32px 1fr 58px;
  gap: 8px;
  padding: 5px 0;
  border-top: 1px solid var(--border);
}

.pick-result-row:first-child { border-top: 0; }

.toolbar-output {
  margin-top: 8px;
  color: var(--muted);
  font-size: 0.76rem;
  line-height: 1.4;
}

.toolbar-title {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 10px;
}

.backtest-controls {
  display: flex;
  gap: 8px;
}

.backtest-controls input {
  flex: 1;
  min-width: 0;
  background: var(--inset);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font: inherit;
  padding: 9px 10px;
}

.status-alert {
  background: #251a06;
  border: 1px solid var(--yellow);
  color: var(--yellow);
  border-radius: 8px;
  padding: 8px 10px;
  margin: 8px 0;
  font-size: 0.76rem;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin: 12px 0;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}

.card.rank-0::before { background: linear-gradient(90deg, #ffd700, #ffb300); }
.card.rank-1::before { background: linear-gradient(90deg, #c0c0c0, #9e9e9e); }
.card.rank-2::before { background: linear-gradient(90deg, #cd7f32, #a0522d); }
.card.rank-3::before,
.card.rank-4::before,
.card.rank-5::before,
.card.rank-6::before { background: var(--border); }

.rank-label {
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin-bottom: 6px;
}

.card.rank-0 .rank-label { color: #ffd700; }
.card.rank-1 .rank-label { color: #c0c0c0; }
.card.rank-2 .rank-label { color: #cd7f32; }

.batter-name {
  font-size: 1.32rem;
  font-weight: 750;
  line-height: 1.2;
}

.batter-team { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }

.prob-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 10px 0 4px;
}

.prob-pct {
  font-size: 2.45rem;
  font-weight: 850;
  color: var(--green);
  letter-spacing: 0;
  line-height: 1;
}

.prob-label { font-size: 0.8rem; color: var(--muted); line-height: 1.3; }
.inline-note { font-size: 0.72rem; color: var(--muted); margin-bottom: 8px; }

.matchup-line { font-size: 0.85rem; color: var(--text); margin-bottom: 2px; }
.game-time { font-size: 0.75rem; color: var(--muted); margin-bottom: 10px; }
.card-summary {
  background: var(--inset);
  border-left: 3px solid var(--blue);
  border-radius: 8px;
  padding: 9px 10px;
  margin: 8px 0 10px;
  color: var(--text);
  font-size: 0.8rem;
  line-height: 1.4;
}

.stat-group-label {
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--muted);
  margin-bottom: 4px;
  opacity: 0.75;
}

.stats-row {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
}

.stat {
  flex: 1;
  background: var(--inset);
  border-radius: 8px;
  padding: 7px 4px;
  text-align: center;
}

.stat-value {
  font-size: 0.98rem;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
}

.stat-label {
  font-size: 0.6rem;
  color: var(--muted);
  margin-top: 2px;
  line-height: 1.2;
}

.factors {
  border-top: 1px solid var(--border);
  padding-top: 10px;
  margin-top: 4px;
}

.factor {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  padding: 3px 0;
  font-size: 0.78rem;
}

.factor-name { color: var(--muted); }
.factor-val { font-weight: 650; text-align: right; }
.good { color: var(--green); }
.bad { color: var(--red); }
.neutral { color: var(--yellow); }

.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}

.stage {
  font-size: 0.8rem;
  margin-top: 8px;
  min-height: 1.2em;
}

.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}

@keyframes spin { to { transform: rotate(360deg); } }

.info-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  color: var(--muted);
  font-size: 0.9rem;
  line-height: 1.6;
}

.info-box strong { color: var(--text); display: block; margin-bottom: 8px; }

.error-box {
  background: #1f0a0a;
  border: 1px solid var(--red);
  border-radius: 12px;
  padding: 16px;
  color: var(--red);
  font-size: 0.85rem;
}

.refresh-btn {
  display: block;
  margin: 16px auto 0;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--blue);
  padding: 10px 24px;
  border-radius: 8px;
  font-size: 0.9rem;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.1s, color 0.1s, border-color 0.1s;
  -webkit-tap-highlight-color: transparent;
}

.refresh-btn:active {
  background: var(--blue);
  color: var(--bg);
  border-color: var(--blue);
}

footer {
  text-align: center;
  padding: 24px 0 8px;
  font-size: 0.7rem;
  color: var(--border);
  line-height: 1.6;
}
</style>
</head>
<body>
<header>
  <h1>MLB HR Watchlist</h1>
  <div class="subtitle" id="date-label">Loading...</div>
  <nav class="tabs" aria-label="Pick type">
    <a class="tab" href="index.html">Hits</a>
    <a class="tab active" href="hr.html">Home Runs</a>
  </nav>
  <div class="top-actions">
    <button class="top-refresh" onclick="refreshPage()" title="Refresh picks" aria-label="Refresh picks">↻</button>
  </div>
  <div class="updated-at" id="updated-at"></div>
</header>

<div id="app">
  <div class="loading">
    <div class="spinner"></div>
    Fetching today's matchups...
  </div>
</div>

<footer>
  Data: MLB Stats API - power, HR rate, pitcher HR risk, handedness, ballpark, batting order<br>
  Home runs are rare. Treat this as a watchlist, not a lock list.
</footer>

<script>
'use strict';

const API = 'https://statsapi.mlb.com/api/v1';
const SEASON = new Date().getFullYear();
const PAGE_CACHE_KEY = 'mlb-hr-watchlist-page-cache-v1';
const FORCE_REFRESH_KEY = 'mlb-hr-watchlist-force-refresh-v1';
const PAGE_CACHE_TTL = 15 * 60 * 1000;
const HR_PICK_STORE_KEY = 'mlb-hr-picks-saved-v1';
const HR_PICK_HISTORY_KEY = 'mlb-hr-picks-history-v1';

let currentHrPicks = [];
let currentHrDate = null;
let lastCheckedHrRows = null;
let lastCheckedHrDate = null;
let lastHrBacktestAuditRows = null;

const LEAGUE = {
  hrPerPa: 0.028,
  iso: 0.152,
  slg: 0.400,
  era: 4.30,
  whip: 1.25,
  hr9: 1.15,
  k9: 9.0,
  kPct: 0.228,
};

const MODEL = {
  minBatterPa: 45,
  batterPaPrior: 220,
  pitcherIpPrior: 60,
  recentPaPrior: 35,
  maxHrPerPa: 0.065,
  calibrationDamp: 0.66,
};

const HR_PARK = {
  115: { factor: 1.24, name: 'Coors Field' },
  147: { factor: 1.18, name: 'Yankee Stadium' },
  113: { factor: 1.16, name: 'Great American Ball Park' },
  143: { factor: 1.12, name: 'Citizens Bank Park' },
  108: { factor: 1.10, name: 'Angel Stadium' },
  112: { factor: 1.08, name: 'Wrigley Field' },
  140: { factor: 1.07, name: 'Globe Life Field' },
  110: { factor: 1.06, name: 'Oriole Park' },
  158: { factor: 1.05, name: 'American Family Field' },
  121: { factor: 1.04, name: 'Citi Field' },
  109: { factor: 1.03, name: 'Chase Field' },
  144: { factor: 1.02, name: 'Truist Park' },
  117: { factor: 1.01, name: 'Minute Maid Park' },
  111: { factor: 1.00, name: 'Fenway Park' },
  145: { factor: 1.00, name: 'Guaranteed Rate Field' },
  138: { factor: 0.99, name: 'Busch Stadium' },
  120: { factor: 0.98, name: 'Nationals Park' },
  114: { factor: 0.98, name: 'Progressive Field' },
  141: { factor: 0.97, name: 'Rogers Centre' },
  116: { factor: 0.97, name: 'Comerica Park' },
  118: { factor: 0.96, name: 'Kauffman Stadium' },
  142: { factor: 0.96, name: 'Target Field' },
  119: { factor: 0.95, name: 'Dodger Stadium' },
  134: { factor: 0.94, name: 'PNC Park' },
  139: { factor: 0.93, name: 'Tropicana Field' },
  136: { factor: 0.92, name: 'T-Mobile Park' },
  146: { factor: 0.92, name: 'loanDepot park' },
  133: { factor: 0.91, name: 'Sutter Health Park' },
  135: { factor: 0.90, name: 'Petco Park' },
  137: { factor: 0.88, name: 'Oracle Park' },
};

const PLATOON = {
  RvR: 1.00, RvL: 1.00,
  LvL: 1.00, LvR: 1.00,
  SvR: 1.00, SvL: 1.00,
};

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function softCap(value, cap) {
  return cap * (1 - Math.exp(-Math.max(0, value) / cap));
}

function shrink(value, baseline, sample, prior) {
  const n = Math.max(0, Number(sample) || 0);
  return ((value * n) + (baseline * prior)) / (n + prior);
}

function splitKeyForHand(hand) {
  return hand === 'L' ? 'vl' : 'vr';
}

function parseSplitStats(d) {
  const out = {};
  for (const split of d.stats?.[0]?.splits || []) {
    const code = split.split?.code;
    const s = split.stat || {};
    if (!code) continue;
    const pa = parseInt(s.plateAppearances || s.battersFaced || s.atBats || '0', 10);
    const ab = parseInt(s.atBats || '0', 10);
    const hits = parseInt(s.hits || '0', 10);
    const so = parseInt(s.strikeOuts || '0', 10);
    const hr = parseInt(s.homeRuns || '0', 10);
    out[code] = {
      pa,
      ab,
      hits,
      hr,
      avg: parseFloat(s.avg || '0'),
      ops: parseFloat(s.ops || '0'),
      slg: parseFloat(s.slg || '0'),
      whip: parseFloat(s.whip || String(LEAGUE.whip)),
      hr9: parseFloat(s.homeRunsPer9 || String(LEAGUE.hr9)),
      k9: parseFloat(s.strikeoutsPer9Inn || s.strikeOutsPer9Inn || String(LEAGUE.k9)),
      kPct: pa > 0 ? so / pa : LEAGUE.kPct,
      hrPerPa: pa > 0 ? hr / pa : LEAGUE.hrPerPa,
    };
  }
  return out;
}

function todayStr() { return new Date().toLocaleDateString('en-CA'); }

function recentStartDate(days = 15) {
  const d = new Date();
  d.setDate(d.getDate() - days);
  return d.toLocaleDateString('en-CA');
}

function addDays(dateStr, days) {
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() + days);
  return d.toLocaleDateString('en-CA');
}

function formatDate(s) {
  return new Date(s + 'T12:00:00').toLocaleDateString('en-US', {
    weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
  });
}

function formatTime(iso) {
  return new Date(iso).toLocaleTimeString('en-US', {
    hour: 'numeric', minute: '2-digit', timeZoneName: 'short'
  });
}

function gameStatusNote(g) {
  const text = g.status?.detailedState || g.status?.reason || '';
  return /delay|rain|postpone/i.test(text) ? text : '';
}

function isPlayableGame(g) {
  const state = g.status?.abstractGameState;
  const code = g.status?.statusCode;
  return state === 'Preview' || state === 'Live' || code === 'S' || code === 'P' || code === 'I';
}

async function fetchJSON(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

function setStage(msg) {
  const el = document.getElementById('stage-msg');
  if (el) el.textContent = msg;
}

function setUpdatedAt(value = new Date()) {
  const el = document.getElementById('updated-at');
  if (!el) return;
  el.textContent = `Updated ${value.toLocaleTimeString('en-US', {
    hour: 'numeric',
    minute: '2-digit',
    timeZoneName: 'short',
  })}`;
}

async function getSchedule(date) {
  const d = await fetchJSON(
    `${API}/schedule?sportId=1&date=${date}&hydrate=probablePitcher,lineups,team`
  );
  return d.dates?.[0]?.games || [];
}

const personCache = new Map();

async function getPersonInfo(id) {
  if (personCache.has(id)) return personCache.get(id);
  try {
    const d = await fetchJSON(`${API}/people/${id}`);
    const p = d.people?.[0] || {};
    const info = {
      batSide: p.batSide?.code || null,
      pitchHand: p.pitchHand?.code || null,
    };
    personCache.set(id, info);
    return info;
  } catch {
    const info = { batSide: null, pitchHand: null };
    personCache.set(id, info);
    return info;
  }
}

async function getBatterHand(id) {
  const info = await getPersonInfo(id);
  return info.batSide || 'R';
}

async function getPitcherInfo(id) {
  try {
    const [sd, pd, sp] = await Promise.all([
      fetchJSON(`${API}/people/${id}/stats?stats=season&season=${SEASON}&group=pitching`),
      getPersonInfo(id),
      fetchJSON(`${API}/people/${id}/stats?stats=statSplits&season=${SEASON}&group=pitching&sitCodes=vl,vr`),
    ]);
    const s = sd.stats?.[0]?.splits?.[0]?.stat || {};
    const ip = parseFloat(s.inningsPitched || '0');
    const hr = parseInt(s.homeRuns || '0', 10);
    return {
      hand: pd.pitchHand || 'R',
      era: parseFloat(s.era || String(LEAGUE.era)),
      whip: parseFloat(s.whip || String(LEAGUE.whip)),
      hr9: ip > 0 ? (hr / ip * 9) : LEAGUE.hr9,
      k9: ip > 0 ? (parseInt(s.strikeOuts || '0', 10) / ip * 9) : LEAGUE.k9,
      ip,
      splits: parseSplitStats(sp),
    };
  } catch {
    return { hand: 'R', era: LEAGUE.era, whip: LEAGUE.whip, hr9: LEAGUE.hr9, k9: LEAGUE.k9, ip: 0 };
  }
}

async function getBatterStats(id) {
  try {
    const [d, sp] = await Promise.all([
      fetchJSON(`${API}/people/${id}/stats?stats=season&season=${SEASON}&group=hitting`),
      fetchJSON(`${API}/people/${id}/stats?stats=statSplits&season=${SEASON}&group=hitting&sitCodes=vl,vr,a`),
    ]);
    const s = d.stats?.[0]?.splits?.[0]?.stat;
    if (!s) return null;
    const ab = parseInt(s.atBats || '0', 10);
    const pa = parseInt(s.plateAppearances || s.atBats || '0', 10);
    const hr = parseInt(s.homeRuns || '0', 10);
    const so = parseInt(s.strikeOuts || '0', 10);
    const avg = parseFloat(s.avg || '0');
    const slg = parseFloat(s.slg || '0');
    return {
      avg,
      slg,
      ops: parseFloat(s.ops || '0'),
      iso: Math.max(0, slg - avg),
      hr,
      ab,
      pa,
      hrPerPa: pa > 0 ? hr / pa : LEAGUE.hrPerPa,
      kPct: pa > 0 ? so / pa : LEAGUE.kPct,
      splits: parseSplitStats(sp),
    };
  } catch { return null; }
}

async function getBatterRecentPower(id, startDate, endDate) {
  try {
    const d = await fetchJSON(
      `${API}/people/${id}/stats?stats=byDateRange&season=${SEASON}&group=hitting` +
      `&startDate=${startDate}&endDate=${endDate}`
    );
    const s = d.stats?.[0]?.splits?.[0]?.stat;
    if (!s) return null;
    const pa = parseInt(s.plateAppearances || s.atBats || '0', 10);
    const hr = parseInt(s.homeRuns || '0', 10);
    if (pa < 10) return null;
    return {
      pa,
      hr,
      hrPerPa: hr / pa,
      slg: parseFloat(s.slg || '0'),
    };
  } catch { return null; }
}

async function getPitcherRecentHrRisk(id) {
  try {
    const d = await fetchJSON(
      `${API}/people/${id}/stats?stats=gameLog&season=${SEASON}&group=pitching`
    );
    const games = (d.stats?.[0]?.splits || []).slice(-5);
    let ip = 0;
    let hr = 0;
    for (const g of games) {
      const s = g.stat || {};
      ip += parseFloat(s.inningsPitched || '0') || 0;
      hr += parseInt(s.homeRuns || '0', 10) || 0;
    }
    if (ip <= 0) return null;
    return { hr9: hr / ip * 9, ip, hr };
  } catch {
    return null;
  }
}

function expectedPAs(lineupPos) {
  const table = [4.7, 4.5, 4.3, 4.1, 4.0, 3.9, 3.8, 3.6, 3.5];
  return table[clamp(lineupPos - 1, 0, 8)];
}

function ttoFactor(lineupPos) {
  if (lineupPos <= 2) return 1.035;
  if (lineupPos <= 4) return 1.025;
  if (lineupPos <= 6) return 1.010;
  return 1.0;
}

function calibrateProbability(rawProb, ePAs) {
  const leagueProb = 1 - Math.pow(1 - LEAGUE.hrPerPa, ePAs);
  return clamp(
    leagueProb + ((rawProb - leagueProb) * MODEL.calibrationDamp),
    0.025,
    0.33
  );
}

function average(values) {
  const nums = values.filter(v => Number.isFinite(v));
  if (!nums.length) return null;
  return nums.reduce((sum, v) => sum + v, 0) / nums.length;
}

function hrGameEnvironmentFactors(candidates) {
  const factors = new Map();
  for (const pick of candidates) {
    factors.set(pick.gamePk, 1.0);
  }
  return factors;
}

function score(batter, pitcher, parkFactor, batterHand, lineupPos, gameEnvFactor = 1.0, isAway = false) {
  const platoon = PLATOON[`${batterHand}v${pitcher.hand}`] ?? 1.0;
  const matchupBatterHand = batterHand === 'S'
    ? (pitcher.hand === 'L' ? 'R' : 'L')
    : batterHand;
  const batterSplit = batter.splits?.[splitKeyForHand(pitcher.hand)] || null;
  const pitcherSplit = pitcher.splits?.[splitKeyForHand(matchupBatterHand)] || null;
  const awaySplit = isAway ? batter.splits?.a || null : null;
  const ePAs = expectedPAs(lineupPos);
  const splitHrPerPa = batterSplit
    ? shrink(batterSplit.hrPerPa || LEAGUE.hrPerPa, batter.hrPerPa || LEAGUE.hrPerPa, batterSplit.pa, 140)
    : (batter.hrPerPa || LEAGUE.hrPerPa);
  const seasonHrRate = shrink(
    splitHrPerPa,
    LEAGUE.hrPerPa,
    Math.max(batter.pa || 0, batterSplit?.pa || 0),
    MODEL.batterPaPrior
  );
  const splitAvg = batterSplit
    ? shrink(batterSplit.avg || batter.avg || 0, batter.avg || 0, batterSplit.pa, 140)
    : batter.avg;
  const splitSlg = batterSplit
    ? shrink(batterSplit.slg || batter.slg || LEAGUE.slg, batter.slg || LEAGUE.slg, batterSplit.pa, 140)
    : batter.slg;
  const splitIso = Math.max(0, (splitSlg || LEAGUE.slg) - (splitAvg || 0));
  const isoAdj = clamp(
    1 + 0.70 * ((splitIso || LEAGUE.iso) - LEAGUE.iso) / LEAGUE.iso,
    0.50, 1.95
  );
  const hrParkFactor = clamp(1 + ((parkFactor - 1) * 0.65), 0.92, 1.16);
  const contactAdj = 1.0;
  const recentAdj = 1.0;
  const awayAdj = 1.0;
  const splitHr9 = pitcherSplit
    ? shrink(pitcherSplit.hr9 || LEAGUE.hr9, pitcher.hr9 || LEAGUE.hr9, pitcherSplit.pa, 120)
    : pitcher.hr9;
  const splitK9 = pitcherSplit
    ? shrink(pitcherSplit.k9 || LEAGUE.k9, pitcher.k9 || LEAGUE.k9, pitcherSplit.pa, 120)
    : pitcher.k9;
  const splitWhip = pitcherSplit
    ? shrink(pitcherSplit.whip || LEAGUE.whip, pitcher.whip || LEAGUE.whip, pitcherSplit.pa, 120)
    : pitcher.whip;
  const recentHr9 = pitcher.recentHr9 != null
    ? shrink(pitcher.recentHr9, splitHr9 || LEAGUE.hr9, pitcher.recentHrIp || 0, 18)
    : splitHr9;
  const rawPitcherRisk = clamp(
    (splitHr9 / LEAGUE.hr9) * 0.45 +
    (recentHr9 / LEAGUE.hr9) * 0.15 +
    (LEAGUE.k9 / Math.max(splitK9, 1)) * 0.22 +
    (pitcher.era / LEAGUE.era) * 0.08 +
    (splitWhip / LEAGUE.whip) * 0.10,
    0.65, 1.65
  );
  const pitcherRisk = clamp(
    shrink(rawPitcherRisk, 1.0, pitcher.ip || 0, MODEL.pitcherIpPrior) * ttoFactor(lineupPos),
    0.78, 1.38
  );
  const rawPHr = seasonHrRate * isoAdj * contactAdj * recentAdj * awayAdj * pitcherRisk * platoon * hrParkFactor * gameEnvFactor;
  const pHr = clamp(softCap(rawPHr, MODEL.maxHrPerPa), 0.003, MODEL.maxHrPerPa);
  const rawProb = 1 - Math.pow(1 - pHr, ePAs);
  const prob = calibrateProbability(rawProb, ePAs);

  return {
    prob, rawProb, pHr, seasonHrRate,
    isoAdj, contactAdj, recentAdj, awayAdj, pitcherRisk, platoon, parkFactor, parkAdj: hrParkFactor, ttoAdj: ttoFactor(lineupPos), gameEnvFactor,
    ePAs, batterHand, pitcherHand: pitcher.hand, batterSplit, pitcherSplit, awaySplit, isAway,
  };
}

const CLASSIC_PLATOON = {
  RvR: 0.96, RvL: 1.09,
  LvL: 0.92, LvR: 1.09,
  SvR: 1.04, SvL: 1.04,
};

function classicScore(batter, pitcher, parkFactor, batterHand, lineupPos) {
  const platoon = CLASSIC_PLATOON[`${batterHand}v${pitcher.hand}`] ?? 1.0;
  const ePAs = expectedPAs(lineupPos);
  const seasonHrRate = shrink(
    batter.hrPerPa || LEAGUE.hrPerPa,
    LEAGUE.hrPerPa,
    batter.pa || 0,
    220
  );
  const isoAdj = clamp(
    1 + 0.60 * ((batter.iso || LEAGUE.iso) - LEAGUE.iso) / LEAGUE.iso,
    0.55, 1.85
  );
  const slgAdj = clamp(
    1 + 0.10 * ((batter.slg || LEAGUE.slg) - LEAGUE.slg) / LEAGUE.slg,
    0.90, 1.15
  );
  const contactAdj = clamp(
    (1 - (batter.kPct ?? LEAGUE.kPct)) / (1 - LEAGUE.kPct),
    0.78, 1.12
  );
  const recentRate = batter.recentHrPerPa != null
    ? shrink(batter.recentHrPerPa, seasonHrRate, batter.recentPa || 0, 35)
    : null;
  const recentAdj = recentRate != null
    ? clamp(1 + 0.30 * (recentRate - seasonHrRate) / Math.max(seasonHrRate, 0.01), 0.85, 1.20)
    : 1.0;
  const rawPitcherRisk = clamp(
    ((pitcher.hr9 || LEAGUE.hr9) / LEAGUE.hr9) * 0.55 +
    (LEAGUE.k9 / Math.max(pitcher.k9 || LEAGUE.k9, 1)) * 0.25 +
    ((pitcher.era || LEAGUE.era) / LEAGUE.era) * 0.10 +
    ((pitcher.whip || LEAGUE.whip) / LEAGUE.whip) * 0.10,
    0.65, 1.65
  );
  const pitcherRisk = clamp(
    shrink(rawPitcherRisk, 1.0, pitcher.ip || 0, 60),
    0.78, 1.38
  );
  const rawPHr = seasonHrRate * isoAdj * slgAdj * contactAdj * recentAdj * pitcherRisk * platoon * parkFactor;
  const pHr = clamp(softCap(rawPHr, MODEL.maxHrPerPa), 0.003, MODEL.maxHrPerPa);
  const rawProb = 1 - Math.pow(1 - pHr, ePAs);
  const leagueProb = 1 - Math.pow(1 - LEAGUE.hrPerPa, ePAs);
  const prob = clamp(leagueProb + ((rawProb - leagueProb) * 0.72), 0.025, 0.28);

  return { prob, rawProb, pHr, isoAdj, slgAdj, contactAdj, recentAdj, pitcherRisk, platoon };
}

function fmtPct(n) { return `${Math.round(n * 100)}%`; }
function fmtRate(n) {
  if (n == null || isNaN(n)) return '.---';
  return n.toFixed(3).replace(/^0/, '');
}
function fmtNum(n, dec = 2) { return n == null || n === '' || isNaN(n) ? '—' : n.toFixed(dec); }

function fcls(v, goodAbove1 = true) {
  const d = v - 1;
  if (Math.abs(d) < 0.025) return 'neutral';
  return (goodAbove1 ? d > 0 : d < 0) ? 'good' : 'bad';
}

function factorText(v, goodAbove1 = true) {
  const d = v - 1;
  if (Math.abs(d) < 0.025) return 'Neutral';
  const pct = Math.round(Math.abs(d) * 100);
  const word = (goodAbove1 ? d > 0 : d < 0) ? 'Boost' : 'Drag';
  return `${word} ${pct}%`;
}

function platoonLabel(b, p) {
  const bat = b === 'S' ? 'Switch hitter' : b === 'L' ? 'Lefty hitter' : 'Righty hitter';
  const pit = p === 'L' ? 'lefty pitcher' : 'righty pitcher';
  return `${bat} vs ${pit}`;
}

function joinReasons(reasons) {
  if (reasons.length <= 1) return reasons.join('');
  return `${reasons.slice(0, -1).join(', ')} and ${reasons[reasons.length - 1]}`;
}

function hrTier(prob) {
  if (prob >= 0.15) return { label: 'Strong HR spot', cls: 'good' };
  if (prob >= 0.10) return { label: 'Good HR spot', cls: 'neutral' };
  return { label: 'Speculative power shot', cls: 'bad' };
}

function hrPickSummary(pick) {
  const reasons = [];
  if (pick.isoAdj > 1.08) reasons.push('his power profile stands out');
  if (pick.pitcherRisk > 1.06) reasons.push('the pitcher is allowing more HR risk than average');
  if (pick.pitcher.recentHr9 != null && pick.pitcher.recentHr9 > LEAGUE.hr9 * 1.2) reasons.push('the pitcher has allowed recent home run damage');
  if ((pick.parkAdj ?? pick.parkFactor) > 1.04) reasons.push('the ballpark helps home runs');
  if (pick.lineupPos <= 3) reasons.push('he should get more trips to the plate');
  if (pick.platoon > 1.02) reasons.push('the handedness matchup helps');
  if (pick.recentAdj > 1.03) reasons.push('his recent power trend is positive');
  if (pick.isAway && pick.awayAdj > 1.02) reasons.push('his road power profile travels well');
  if (pick.isAway && pick.awayAdj < 0.98) reasons.push('his road power profile is a small concern');
  if (pick.ttoAdj > 1.02) reasons.push('his lineup spot gives him a better shot at seeing a tiring starter');
  if (pick.gameEnvFactor > 1.02) reasons.push('this specific game looks better for home runs overall');
  if (pick.gameEnvFactor < 0.98) reasons.push('this specific game looks tougher for home runs overall');
  if (!reasons.length) reasons.push('his overall power setup is one of the better spots today');
  return `Why this HR shot: ${joinReasons(reasons)}.`;
}

function limitSameGameAndTeam(picks, limit = 2) {
  const gameCounts = new Map();
  const teamCounts = new Map();
  const selected = [];

  for (const pick of picks) {
    const gameKey = pick.gamePk;
    const teamKey = pick.batterTeam;
    if ((gameCounts.get(gameKey) || 0) >= limit) continue;
    if ((teamCounts.get(teamKey) || 0) >= limit) continue;
    selected.push(pick);
    gameCounts.set(gameKey, (gameCounts.get(gameKey) || 0) + 1);
    teamCounts.set(teamKey, (teamCounts.get(teamKey) || 0) + 1);
    if (selected.length >= 10) break;
  }

  return selected;
}

function rankPicks(picks, field, rankField) {
  [...picks]
    .sort((a, b) => b[field] - a[field])
    .forEach((pick, i) => { pick[rankField] = i + 1; });
}

function mergedModelPicks(picks) {
  rankPicks(picks, 'prob', 'currentRank');
  rankPicks(picks, 'classicProb', 'classicRank');

  const currentTop = limitSameGameAndTeam([...picks].sort((a, b) => b.prob - a.prob), 2);
  const classicTop = limitSameGameAndTeam([...picks].sort((a, b) => b.classicProb - a.classicProb), 2);
  const merged = new Map();

  for (const pick of currentTop) merged.set(pick.key, { ...pick, inCurrentTop: true, inClassicTop: false });
  for (const pick of classicTop) {
    const existing = merged.get(pick.key);
    if (existing) existing.inClassicTop = true;
    else merged.set(pick.key, { ...pick, inCurrentTop: false, inClassicTop: true });
  }

  return [...merged.values()].sort((a, b) => {
    const aBest = Math.min(a.currentRank || 999, a.classicRank || 999);
    const bBest = Math.min(b.currentRank || 999, b.classicRank || 999);
    return aBest - bBest || b.prob - a.prob;
  });
}

function restorePageCache() {
  try {
    const cached = JSON.parse(sessionStorage.getItem(PAGE_CACHE_KEY) || 'null');
    if (!cached || Date.now() - cached.savedAt > PAGE_CACHE_TTL) return false;
    const currentStamp = savedHrStateStamp(cached.currentHrDate);
    if (cached.savedStateStamp && currentStamp && cached.savedStateStamp !== currentStamp) return false;
    document.getElementById('app').innerHTML = cached.appHtml;
    document.getElementById('date-label').textContent = cached.dateLabel || 'Cached watchlist';
    document.getElementById('updated-at').textContent = cached.updatedAt || '';
    currentHrDate = cached.currentHrDate || null;
    currentHrPicks = cached.currentHrPicks || [];

  } catch {

}

  'Handedness',
  'Batting Order',
  'Pitcher',
  'Pitcher Hand',
  'Venue',
  'Current Rank',
  'Current Chance',
  'Classic Rank',
  'Classic Chance',
  'In Current Top',
  'In Classic Top',
  'Selected By',
];

function tsvCell(value) {
  return String(value ?? '').replace(/\t/g, ' ').replace(/\r?\n/g, ' ');
}

function rowsToTsvWithColumns(columns, rows) {
  return [columns, ...rows].map(row => row.map(tsvCell).join('\t')).join('\n');
}

function getHrPickHistory() {
  try {
    return JSON.parse(localStorage.getItem(HR_PICK_HISTORY_KEY) || '{}');
  } catch {
    return {};
  }
}

function getSavedHrPicksForDate(date) {
  return getHrPickHistory()[date] || null;
}

function getLatestSavedHrPicks() {
  return pickSavedPayload(getHrPickHistory());
}

function getLatestPastSavedHrPicks() {
  return pickSavedPayload(getHrPickHistory(), { pastOnly: true });
}

function getSavedHrPicksForResults() {
  return (currentHrDate && getSavedHrPicksForDate(currentHrDate)) || getLatestPastSavedHrPicks() || getLatestSavedHrPicks();
}

function pickSavedPayload(history, options = {}) {
  const values = Object.values(history || {}).filter(p => p?.date && p?.picks?.length);
  if (!values.length) return null;
  values.sort((a, b) => b.date.localeCompare(a.date));
  if (options.pastOnly) {
    const today = todayStr();
    return values.find(p => p.date < today) || null;
  }
  return values[0];
}

function storeHrPickPayload(payload) {
  const history = getHrPickHistory();
  history[payload.date] = payload;
  localStorage.setItem(HR_PICK_HISTORY_KEY, JSON.stringify(history));
  localStorage.setItem(HR_PICK_STORE_KEY, JSON.stringify(payload));
}

function savedHrStateStamp(date = currentHrDate) {
  const saved = date ? getSavedHrPicksForDate(date) : null;
  return saved?.savedAt || '';
}

function hasSavedHrPicksForDate(date) {
  return !!getHrPickHistory()[date];
}

function hrPickPayload(pick, idx) {
  return {
    rank: idx + 1,
    currentRank: Number.isFinite(pick.currentRank) ? pick.currentRank : null,
    classicRank: Number.isFinite(pick.classicRank) ? pick.classicRank : null,
    classicProb: Number.isFinite(pick.classicProb) ? pick.classicProb : null,
    inCurrentTop: typeof pick.inCurrentTop === 'boolean' ? pick.inCurrentTop : null,
    inClassicTop: typeof pick.inClassicTop === 'boolean' ? pick.inClassicTop : null,
    gamePk: pick.gamePk,
    side: pick.side,
    batterId: pick.batterId,
    batterName: pick.batterName,
    batterTeam: pick.batterTeam,
    prob: pick.prob,
    rawProb: pick.rawProb,
    pHr: pick.pHr,
    isoAdj: pick.isoAdj,
    pitcherRisk: pick.pitcherRisk,
    awayAdj: pick.awayAdj,
    ttoAdj: pick.ttoAdj,
    gameEnvFactor: pick.gameEnvFactor,
    parkFactor: pick.parkFactor,
    parkAdj: pick.parkAdj ?? pick.parkFactor,
    recentAdj: pick.recentAdj,
    contactAdj: pick.contactAdj,
    platoon: pick.platoon,
    pitcherName: pick.pitcherName,
    pitcherHand: pick.pitcherHand,
    lineupPos: pick.lineupPos,
    venue: pick.venue,
  };
}

function currentHrPickPayload() {
  return {
    date: currentHrDate,
    savedAt: new Date().toISOString(),
    modelMetadataVersion: 1,
    picks: currentHrPicks.map(hrPickPayload),
  };
}

function saveCurrentHrPicks() {
  const out = document.getElementById('hr-toolbar-output');
  if (!currentHrDate || !currentHrPicks.length) {
    if (out) out.textContent = 'No HR picks are loaded yet.';
    return;
  }

  const existing = getSavedHrPicksForDate(currentHrDate);
  if (existing?.picks?.length) {
    if (out) out.textContent = `Already saved ${existing.picks.length} HR picks for ${formatDate(existing.date)}. Use "Replace saved HR picks" only if you want to overwrite that locked list.`;
    return;
  }

  const payload = currentHrPickPayload();
  storeHrPickPayload(payload);
  currentHrPicks = payload.picks;
  lastCheckedHrRows = null;
  lastCheckedHrDate = null;
  if (out) out.textContent = `Saved ${payload.picks.length} HR picks for ${formatDate(payload.date)}.`;
  savePageCache();
}

function replaceCurrentHrPicks() {
  const out = document.getElementById('hr-toolbar-output');
  if (!currentHrDate || !currentHrPicks.length) {
    if (out) out.textContent = 'No HR picks are loaded yet.';
    return;
  }
  const payload = currentHrPickPayload();
  storeHrPickPayload(payload);
  currentHrPicks = payload.picks;
  lastCheckedHrRows = null;
  lastCheckedHrDate = null;
  if (out) out.textContent = `Replaced saved HR picks for ${formatDate(payload.date)} with the ${payload.picks.length} currently displayed picks.`;
  savePageCache();
}

function autoSaveCurrentHrPicks() {
  if (!currentHrDate || !currentHrPicks.length) return;
  if (hasSavedHrPicksForDate(currentHrDate)) return;
  const payload = currentHrPickPayload();
  storeHrPickPayload(payload);
  currentHrPicks = payload.picks;
}

function decText(value, places = 3) {
  return value == null || value === '' || isNaN(value) ? '' : Number(value).toFixed(places);
}

function savedModelSelection(pick) {
  if (pick.inCurrentTop === true && pick.inClassicTop === true) return 'both';
  if (pick.inCurrentTop === true) return 'current';
  if (pick.inClassicTop === true) return 'classic';
  return '';
}

function savedModelFlag(value) {
  return typeof value === 'boolean' ? (value ? 1 : 0) : '';
}

function hrAnalysisRow(date, pick, result = '', hr = '', source = 'pick') {
  const outcome = result === 'HR' ? 1 : result === 'No HR' ? 0 : '';
  const isAudit = source === 'audit';
  return [
    source,
    date,
    pick.rank,
    pick.batterName,
    pick.batterTeam,
    fmtPct(pick.prob),
    result,
    outcome,
    hr,
    decText(pick.pHr),
    decText(pick.isoAdj),
    decText(pick.pitcherRisk),
    decText(pick.awayAdj),
    decText(pick.ttoAdj),
    decText(pick.gameEnvFactor),
    decText(pick.parkAdj ?? pick.parkFactor),
    decText(pick.recentAdj),
    decText(pick.contactAdj),
    decText(pick.platoon),
    pick.lineupPos,
    pick.pitcherName,
    pick.pitcherHand === 'L' ? 'Lefty' : 'Righty',
    pick.venue,
    Number.isFinite(pick.currentRank) ? pick.currentRank : (isAudit ? pick.rank : ''),
    decText(pick.prob, 4),
    Number.isFinite(pick.classicRank) ? pick.classicRank : '',
    decText(pick.classicProb, 4),
    isAudit ? '' : savedModelFlag(pick.inCurrentTop),
    isAudit ? '' : savedModelFlag(pick.inClassicTop),
    isAudit ? '' : savedModelSelection(pick),
  ];
}

function hrAuditRowToAnalysisRow(row) {
  return hrAnalysisRow(row.date, row.pick, row.result, row.hr, 'audit');
}

async function copyText(text, successMessage) {
  const out = document.getElementById('hr-toolbar-output');
  try {
    const clipboard = globalThis.navigator?.clipboard;
    if (clipboard?.writeText) {
      await clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    if (out) out.textContent = successMessage;
    savePageCache();
  } catch (e) {
    if (out) out.innerHTML = `<span class="bad">Copy failed: ${e.message}</span>`;
  }
}

async function copyTextToOutput(text, successMessage, outputId) {
  const out = document.getElementById(outputId);
  try {
    const clipboard = globalThis.navigator?.clipboard;
    if (clipboard?.writeText) {
      await clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    if (out) out.textContent = successMessage;
  } catch (e) {
    if (out) out.innerHTML = `<span class="bad">Copy failed: ${e.message}</span>`;
  }
}

function renderSavedHrResults(saved, rows) {

async function getBoxscore(gamePk) {
  return fetchJSON(`${API}/game/${gamePk}/boxscore`);
}

async function getBatterStatsThroughDate(id, endDate) {
  try {
    const season = new Date(endDate + 'T12:00:00').getFullYear();
    const startDate = `${season}-03-01`;
    const d = await fetchJSON(
      `${API}/people/${id}/stats?stats=byDateRange&season=${season}&group=hitting` +
      `&startDate=${startDate}&endDate=${endDate}`
    );
    const s = d.stats?.[0]?.splits?.[0]?.stat;
    if (!s) return null;
    const ab = parseInt(s.atBats || '0', 10);
    const pa = parseInt(s.plateAppearances || s.atBats || '0', 10);
    const hr = parseInt(s.homeRuns || '0', 10);
    const so = parseInt(s.strikeOuts || '0', 10);
    const avg = parseFloat(s.avg || '0');
    const slg = parseFloat(s.slg || '0');
    return {
      avg,
      slg,
      ops: parseFloat(s.ops || '0'),
      iso: Math.max(0, slg - avg),
      hr,
      ab,
      pa,
      hrPerPa: pa > 0 ? hr / pa : LEAGUE.hrPerPa,
      kPct: pa > 0 ? so / pa : LEAGUE.kPct,
    };
  } catch {
    return null;
  }
}

async function getPitcherInfoThroughDate(id, endDate) {
  try {
    const season = new Date(endDate + 'T12:00:00').getFullYear();
    const startDate = `${season}-03-01`;
    const [sd, pd] = await Promise.all([
      fetchJSON(`${API}/people/${id}/stats?stats=byDateRange&season=${season}&group=pitching&startDate=${startDate}&endDate=${endDate}`),
      getPersonInfo(id),
    ]);
    const s = sd.stats?.[0]?.splits?.[0]?.stat || {};
    const ip = parseFloat(s.inningsPitched || '0');
    const hr = parseInt(s.homeRuns || '0', 10);
    return {
      hand: pd.pitchHand || 'R',
      era: parseFloat(s.era || String(LEAGUE.era)),
      whip: parseFloat(s.whip || String(LEAGUE.whip)),
      hr9: ip > 0 ? (hr / ip * 9) : LEAGUE.hr9,
      k9: ip > 0 ? (parseInt(s.strikeOuts || '0', 10) / ip * 9) : LEAGUE.k9,
      ip,
    };
  } catch {
    return getPitcherInfo(id);
  }
}

async function checkSavedHrPicks(saved = getSavedHrPicksForResults(), missingText = 'No saved HR picks yet. Tap "Save HR picks" first.') {
  const out = document.getElementById('hr-toolbar-output');
  if (!saved?.picks?.length) {
    if (out) out.textContent = missingText;
    return;
  }

  if (out) out.textContent = 'Checking final boxscores...';

  try {
    const boxscores = new Map();
    await Promise.all([...new Set(saved.picks.map(p => p.gamePk).filter(Boolean))].map(async gamePk => {
      boxscores.set(gamePk, await getBoxscore(gamePk));
    }));

    const rows = saved.picks.map(pick => {
      const box = boxscores.get(pick.gamePk);
      const player = Object.values(box?.teams?.[pick.side]?.players || {})
        .find(p => p.person?.id === pick.batterId);
      const batting = player?.stats?.batting;
      return {
        rank: pick.rank,
        name: pick.batterName,
        status: batting ? 'final' : 'pending',
        hr: batting?.homeRuns ?? '',
      };
    });

    lastCheckedHrRows = rows;
    lastCheckedHrDate = saved.date;
    if (out) out.innerHTML = renderSavedHrResults(saved, rows);
    savePageCache();
  } catch (e) {
    if (out) out.innerHTML = `<span class="bad">Could not check saved HR picks: ${e.message}</span>`;
  }
}

async function getSavedHrRowsWithResults(saved = getSavedHrPicksForResults()) {
  if (!saved?.picks?.length) return null;

  const boxscores = new Map();
  await Promise.all([...new Set(saved.picks.map(p => p.gamePk).filter(Boolean))].map(async gamePk => {
    boxscores.set(gamePk, await getBoxscore(gamePk));
  }));

  const rows = saved.picks.map(pick => {
    const box = boxscores.get(pick.gamePk);
    const player = Object.values(box?.teams?.[pick.side]?.players || {})
      .find(p => p.person?.id === pick.batterId);
    const batting = player?.stats?.batting;
    const hr = batting?.homeRuns ?? '';

      result: batting ? (hr > 0 ? 'HR' : 'No HR') : 'Pending',

  return { saved, rows };

async function runHrBacktest() {
  const input = document.getElementById('hr-backtest-date');
  const out = document.getElementById('hr-backtest-output');
  const date = input?.value || addDays(todayStr(), -1);
  const priorDate = addDays(date, -1);
  lastHrBacktestAuditRows = null;
  if (out) out.textContent = 'Running HR full slate audit...';

  try {
    const games = (await getSchedule(date)).filter(g =>
      g.status?.statusCode === 'F' &&
      g.lineups?.homePlayers?.length &&
      g.lineups?.awayPlayers?.length
    );
    const pitcherIds = new Set();
    const batterIds = new Set();
    const entries = [];

    for (const g of games) {
      if (g.teams?.home?.probablePitcher?.id) pitcherIds.add(g.teams.home.probablePitcher.id);
      if (g.teams?.away?.probablePitcher?.id) pitcherIds.add(g.teams.away.probablePitcher.id);
      const sides = [
        { side: 'away', players: g.lineups.awayPlayers, team: g.teams?.away?.team?.name ?? 'Away', pitcher: g.teams?.home?.probablePitcher },
        { side: 'home', players: g.lineups.homePlayers, team: g.teams?.home?.team?.name ?? 'Home', pitcher: g.teams?.away?.probablePitcher },
      ];
      for (const side of sides) {
        side.players.forEach((p, idx) => {
          batterIds.add(p.id);
          entries.push({
            gamePk: g.gamePk,
            side: side.side,
            id: p.id,
            name: p.fullName,
            team: side.team,
            lineupPos: idx + 1,
            pitcher: side.pitcher,
            pitcherName: side.pitcher?.fullName ?? '',
            parkFactor: HR_PARK[g.teams?.home?.team?.id]?.factor ?? 1.00,
            venue: g.venue?.name ?? 'Unknown',
          });
        });
      }
    }

    const pitcherInfo = {};
    await Promise.all([...pitcherIds].map(async id => {
      pitcherInfo[id] = await getPitcherInfoThroughDate(id, priorDate);
    }));

    const batterStats = {};
    const batterHands = {};
    await Promise.all([...batterIds].map(async id => {
      const [stats, hand] = await Promise.all([getBatterStatsThroughDate(id, priorDate), getBatterHand(id)]);
      batterStats[id] = stats;
      batterHands[id] = hand;
    }));

    const preScores = [];
    for (const e of entries) {
      const batter = batterStats[e.id];
      const pitcher = pitcherInfo[e.pitcher?.id];
      if (!batter || batter.pa < MODEL.minBatterPa || !pitcher) continue;
      preScores.push({
        gamePk: e.gamePk,
        parkFactor: e.parkFactor,
        ...score(batter, pitcher, e.parkFactor, batterHands[e.id] || 'R', e.lineupPos, 1.0, e.side === 'away'),
      });
    }
    const gameEnvFactors = hrGameEnvironmentFactors(preScores);

    const boxscores = new Map();
    await Promise.all(games.map(async g => {
      boxscores.set(g.gamePk, await getBoxscore(g.gamePk));
    }));

    const auditRows = [];
    let homers = 0;
    let probSum = 0;
    for (const e of entries) {
      const batter = batterStats[e.id];
      const pitcher = pitcherInfo[e.pitcher?.id];
      if (!batter || batter.pa < MODEL.minBatterPa || !pitcher) continue;
      const gameEnvFactor = gameEnvFactors.get(e.gamePk) ?? 1.0;
      const s = score(batter, pitcher, e.parkFactor, batterHands[e.id] || 'R', e.lineupPos, gameEnvFactor, e.side === 'away');
      const boxPlayer = Object.values(boxscores.get(e.gamePk)?.teams?.[e.side]?.players || {})
        .find(p => p.person?.id === e.id);
      if (!boxPlayer?.stats?.batting) continue;
      const hr = boxPlayer.stats.batting.homeRuns || 0;
      homers += hr > 0 ? 1 : 0;
      probSum += s.prob;
      auditRows.push({
        date,
        sortProb: s.prob,
        result: hr > 0 ? 'HR' : 'No HR',
        hr,
        pick: {
          rank: 0,
          batterName: e.name,
          batterTeam: e.team,
          prob: s.prob,
          pHr: s.pHr,
          isoAdj: s.isoAdj,
          pitcherRisk: s.pitcherRisk,
          awayAdj: s.awayAdj,
          ttoAdj: s.ttoAdj,
          gameEnvFactor: s.gameEnvFactor,
          parkFactor: s.parkFactor,
          parkAdj: s.parkAdj,
          recentAdj: s.recentAdj,
          contactAdj: s.contactAdj,
          platoon: s.platoon,
          lineupPos: e.lineupPos,
          pitcherName: e.pitcherName,
          pitcherHand: s.pitcherHand,
          venue: e.venue,
        },
      });
    }

    auditRows.sort((a, b) => b.sortProb - a.sortProb);
    auditRows.forEach((row, idx) => { row.pick.rank = idx + 1; });
    lastHrBacktestAuditRows = auditRows;

    if (out) out.innerHTML = renderHrBacktestResult({
      date,
      games: games.length,
      picks: auditRows.length,
      hrRate: auditRows.length ? homers / auditRows.length : 0,
      avgProb: auditRows.length ? probSum / auditRows.length : 0,
    });
  } catch (e) {
    lastHrBacktestAuditRows = null;
    if (out) out.innerHTML = `<span class="bad">HR audit failed: ${e.message}</span>`;
  }
}

async function copyHrBacktestCombinedRows() {

    return;
  }

  const saved = auditDate ? getSavedHrPicksForDate(auditDate) : null;

    ? pickData.rows.map(row => hrAnalysisRow(

  const auditRows = lastHrBacktestAuditRows.map(hrAuditRowToAnalysisRow);
  const rows = [...pickRows, ...auditRows];
  await copyTextToOutput(
    rowsToTsvWithColumns(HR_ANALYSIS_COLUMNS, rows),
    `Copied ${pickRows.length} HR pick rows and ${auditRows.length} HR audit rows. Paste once into the HR Analysis tab.`,
    'hr-backtest-output'
  );
}

  if (!games.length) {
    show(renderToolbar() + `<div class="info-box"><strong>No Games Today</strong>No MLB games scheduled.</div>` + renderHrBacktestPanel());
    savePageCache();
    return;
  }

  const gamesWithLineups = games.filter(g =>
    isPlayableGame(g) &&
    g.lineups?.homePlayers?.length &&
    g.lineups?.awayPlayers?.length
  );

  if (!gamesWithLineups.length) {
    show(renderToolbar() + `
      <div class="info-box">
        <strong>Lineups Not Yet Posted</strong>
        Try again once lineups are posted, usually 3-4 hours before first pitch.
        <button class="refresh-btn" onclick="refreshPage()">Refresh</button>
      </div>` + renderHrBacktestPanel());
    savePageCache();
    return;
  }

  show(`<div class="loading"><div class="spinner"></div>Building HR watchlist...<div class="stage" id="stage-msg">Fetching pitchers...</div></div>`);

  const pitcherIds = new Set();
  const batterIds = new Set();
  const lineupEntries = [];

  for (const g of gamesWithLineups) {
    if (g.teams?.home?.probablePitcher?.id) pitcherIds.add(g.teams.home.probablePitcher.id);
    if (g.teams?.away?.probablePitcher?.id) pitcherIds.add(g.teams.away.probablePitcher.id);
    const sides = [
      { side: 'away', players: g.lineups.awayPlayers, team: g.teams?.away?.team?.name ?? 'Away', pitcher: g.teams?.home?.probablePitcher },
      { side: 'home', players: g.lineups.homePlayers, team: g.teams?.home?.team?.name ?? 'Home', pitcher: g.teams?.away?.probablePitcher },
    ];
    for (const { side, players, team, pitcher } of sides) {
      players.forEach((p, idx) => {
        batterIds.add(p.id);
        lineupEntries.push({
          key: `${g.gamePk}-${p.id}-${idx}`,
          id: p.id,
          side,
          name: p.fullName,
          team,
          lineupPos: idx + 1,
          pitcher,
          gamePk: g.gamePk,
          homeTeamId: g.teams?.home?.team?.id,
          parkFactor: HR_PARK[g.teams?.home?.team?.id]?.factor ?? 1.00,
          venue: g.venue?.name ?? 'Unknown',
          gameTime: formatTime(g.gameDate),
          statusNote: gameStatusNote(g),
        });
      });
    }
  }

  const pitcherInfo = {};
  await Promise.all([...pitcherIds].map(async id => {
    pitcherInfo[id] = await getPitcherInfo(id);
  }));

  setStage('Fetching hitters...');

  const batterStats = {};
  const batterHands = {};
  const ids = [...batterIds];
  const BATCH = 12;
  for (let i = 0; i < ids.length; i += BATCH) {
    setStage(`Fetching hitters... ${Math.min(i + BATCH, ids.length)}/${ids.length}`);
    await Promise.all(ids.slice(i, i + BATCH).map(async id => {
      const [stats, hand] = await Promise.all([getBatterStats(id), getBatterHand(id)]);
      batterStats[id] = stats;
      batterHands[id] = hand;
    }));
  }

  setStage('Scoring power spots...');
  const candidates = [];

  for (const meta of lineupEntries) {
    const batter = batterStats[meta.id];
    if (!batter || batter.pa < MODEL.minBatterPa || !meta.pitcher) continue;
    const pitcher = pitcherInfo[meta.pitcher.id];
    if (!pitcher) continue;
    const s = score(batter, pitcher, meta.parkFactor, batterHands[meta.id] || 'R', meta.lineupPos, 1.0, meta.side === 'away');
    const classic = classicScore(batter, pitcher, meta.parkFactor, batterHands[meta.id] || 'R', meta.lineupPos);
    candidates.push({
      key: meta.key,
      batterId: meta.id,
      side: meta.side,
      batterName: meta.name,
      batterTeam: meta.team,
      pitcherId: meta.pitcher.id,
      pitcherName: meta.pitcher.fullName,
      pitcherHand: pitcher.hand,
      gamePk: meta.gamePk,
      homeTeamId: meta.homeTeamId,
      parkFactor: meta.parkFactor,
      venue: meta.venue,
      gameTime: meta.gameTime,
      statusNote: meta.statusNote,
      lineupPos: meta.lineupPos,
      batter: { ...batter },
      pitcher,
      ...s,
      classicProb: classic.prob,
      classicPHr: classic.pHr,
    });
  }

  const gameEnvFactors = hrGameEnvironmentFactors(candidates);
  for (const pick of candidates) {
    const gameEnvFactor = gameEnvFactors.get(pick.gamePk) ?? 1.0;
    Object.assign(pick, score(
      pick.batter, pick.pitcher, pick.parkFactor, pick.batterHand, pick.lineupPos, gameEnvFactor, pick.side === 'away'
    ));
    const classic = classicScore(pick.batter, pick.pitcher, pick.parkFactor, pick.batterHand, pick.lineupPos);
    pick.classicProb = classic.prob;
    pick.classicPHr = classic.pHr;
  }
  rankPicks(candidates, 'prob', 'currentRank');
  rankPicks(candidates, 'classicProb', 'classicRank');
  const top30Keys = new Set([
    ...[...candidates].sort((a, b) => b.prob - a.prob).slice(0, 30).map(p => p.key),
    ...[...candidates].sort((a, b) => b.classicProb - a.classicProb).slice(0, 30).map(p => p.key),
  ]);
  const top30 = candidates.filter(p => top30Keys.has(p.key));

  setStage('Checking recent power...');
  const pitcherRecent = new Map();
  await Promise.all(
    [...new Set(top30.map(p => p.pitcherId).filter(Boolean))].map(async pid => {
      pitcherRecent.set(pid, await getPitcherRecentHrRisk(pid));
    })
  );

  await Promise.all(top30.map(async pick => {
    const recent = await getBatterRecentPower(pick.batterId, startDate, date);
    if (recent) {
      pick.batter.recentHr = recent.hr;
      pick.batter.recentPa = recent.pa;
      pick.batter.recentHrPerPa = recent.hrPerPa;
      pick.batter.recentSlg = recent.slg;
    }
    const pitcherRecentHr = pitcherRecent.get(pick.pitcherId);
    if (pitcherRecentHr) {
      pick.pitcher.recentHr9 = pitcherRecentHr.hr9;
      pick.pitcher.recentHrIp = pitcherRecentHr.ip;
      pick.pitcher.recentHr = pitcherRecentHr.hr;
    }
    const gameEnvFactor = gameEnvFactors.get(pick.gamePk) ?? 1.0;
    Object.assign(pick, score(
      pick.batter, pick.pitcher, pick.parkFactor, pick.batterHand, pick.lineupPos, gameEnvFactor, pick.side === 'away'
    ));
    const classic = classicScore(pick.batter, pick.pitcher, pick.parkFactor, pick.batterHand, pick.lineupPos);
    pick.classicProb = classic.prob;
    pick.classicPHr = classic.pHr;
  }));

  const topPicks = mergedModelPicks(top30);

  if (!topPicks.length) {
    show(renderToolbar() + `<div class="info-box"><strong>No HR Watchlist Yet</strong>Try again once lineups and player stats are available.</div>` + renderHrBacktestPanel());
    savePageCache();
    return;
  }

  currentHrDate = date;
  currentHrPicks = topPicks;

  show(
    renderSummary(topPicks) +
    renderToolbar() +
    renderHrBacktestPanel() +
    `<div class="note">Home runs are rare. A 15% chance is a strong HR spot, but it still misses most of the time.</div>` +
    topPicks.map((p, i) => renderCard(p, i)).join('') +
    `<button class="refresh-btn" onclick="refreshPage()">Refresh</button>`
  );
  savePageCache();
}

if (!shouldForceRefresh() && (restorePageCache() || restoreSavedHrView())) {
  // Restored the locked tracking view.
} else {
  main().catch(e => show(
    `<div class="error-box">Error: ${e.message}<button class="refresh-btn" onclick="refreshPage()">Retry</button></div>`
  ));
}
</script>
</body>
</html>
